name: Android APK
on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DeutschFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeutschFlow-apk
          path: android-app/DeutschFlow.apk
      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DeutschFlow Android (latest)
          body: Debug build of the Android app. It loads the live site, so content updates arrive without reinstalling.
          files: android-app/DeutschFlow.apk
          make_latest: true
