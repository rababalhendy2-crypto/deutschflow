name: Android APK
on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add permissions (microphone, notifications) and TTS query
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' "$M"
          grep -n "permission\|TTS_SERVICE" "$M"
      - run: npx cap sync android
      # Copying the key to ~/.android was not enough: Gradle on the runner still signed with a fresh random key,
      # so every APK had a different signature and Android refused to install it over the old app.
      # Point the debug signing config at the key in the repo, and give every build a higher versionCode.
      - name: Sign with the fixed test key and number each build
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1") + 100
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Check the APK carries the fixed key (else updates would not install over the old app)
        run: |
          want=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | awk '{print $2}')
          got=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA256:" | awk '{print $2}')
          echo "want $want"; echo "got  $got"
          test -n "$want" && test "$want" = "$got"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DeutschFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeutschFlow-apk
          path: android-app/DeutschFlow.apk
      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DeutschFlow Android (latest)
          body: Debug build of the Android app. It loads the live site, so content updates arrive without reinstalling.
          files: android-app/DeutschFlow.apk
          make_latest: true
