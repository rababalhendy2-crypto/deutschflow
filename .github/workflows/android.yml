name: Android APK
on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add permissions (microphone, notifications) and TTS query
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' "$M"
          grep -n "permission\|TTS_SERVICE" "$M"
      - run: npx cap sync android
      - name: Use the fixed test signing key so each new APK installs over the old one
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DeutschFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeutschFlow-apk
          path: android-app/DeutschFlow.apk
      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DeutschFlow Android (latest)
          body: Debug build of the Android app. It loads the live site, so content updates arrive without reinstalling.
          files: android-app/DeutschFlow.apk
          make_latest: true
