<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F8F7"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script src="supabase.js"></script><title>DeutschFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one readable column (max 760px) with a sticky top bar and a bottom tab bar, like a native app.
   Warm cream and plum ink, tangerine for actions, violet and sunflower for highlights; German text in a grotesk, Arabic in Plex Arabic. */
:root{
  --bg:#FFF6EC; --surface:#FFFFFF; --surface2:#FFEAD5; --line:#F0D8C2; --fg:#24143A; --muted:#6E5A70;
  --primary:#F2542D; --primary-fg:#FFFFFF; --accent:#7B3FE4; --accent-soft:#EEE3FF;
  --ok:#1C7F4E; --ok-soft:#DDF2E6; --bad:#C0331B; --bad-soft:#FDE1D9; --warn:#9A6A10; --hl:#FFD23F;
  --shadow:0 1px 2px rgba(36,20,58,.06),0 8px 24px rgba(242,84,45,.10);
  --f-de:"Rubik","Segoe UI",system-ui,sans-serif;
  --f-body:"Rubik","Noto Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-ar:"Rubik","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#160E22; --surface:#21152F; --surface2:#2C1D3E; --line:#3A2950; --fg:#F7EEFF; --muted:#B9A6C9;
  --primary:#FF7A55; --primary-fg:#1A0E05; --accent:#B58CFF; --accent-soft:#2F2148;
  --ok:#53D18B; --ok-soft:#123222; --bad:#FF8D63; --bad-soft:#3A1E14; --warn:#E3B04B; --hl:#FFC233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#160E22; --surface:#21152F; --surface2:#2C1D3E; --line:#3A2950; --fg:#F7EEFF; --muted:#B9A6C9;
  --primary:#FF7A55; --primary-fg:#1A0E05; --accent:#B58CFF; --accent-soft:#2F2148;
  --ok:#53D18B; --ok-soft:#123222; --bad:#FF8D63; --bad-soft:#3A1E14; --warn:#E3B04B; --hl:#FFC233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
/* the app's own theme choice wins over the viewer's */
:root[data-df-theme="light"]{
  --bg:#FFF6EC; --surface:#FFFFFF; --surface2:#FFEAD5; --line:#F0D8C2; --fg:#24143A; --muted:#6E5A70;
  --primary:#F2542D; --primary-fg:#FFFFFF; --accent:#7B3FE4; --accent-soft:#EEE3FF;
  --ok:#1C7F4E; --ok-soft:#DDF2E6; --bad:#C0331B; --bad-soft:#FDE1D9; --warn:#9A6A10; --hl:#FFD23F;
  --shadow:0 1px 2px rgba(36,20,58,.06),0 8px 24px rgba(242,84,45,.10); color-scheme:light}
:root[data-df-theme="dark"]{
  --bg:#160E22; --surface:#21152F; --surface2:#2C1D3E; --line:#3A2950; --fg:#F7EEFF; --muted:#B9A6C9;
  --primary:#FF7A55; --primary-fg:#1A0E05; --accent:#B58CFF; --accent-soft:#2F2148;
  --ok:#53D18B; --ok-soft:#123222; --bad:#FF8D63; --bad-soft:#3A1E14; --warn:#E3B04B; --hl:#FFC233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.6}
.app[dir="rtl"]{font-family:var(--f-ar)}
[lang="de"]{font-family:var(--f-de)}
[lang="ar"]{font-family:var(--f-ar)}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{width:20px;height:20px;flex:none}
.visually-hidden,.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.app{max-width:760px;margin:0 auto;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-de);font-weight:800;font-size:20px;letter-spacing:-.02em;direction:ltr}
.brand i{font-style:normal;color:var(--accent)}
.sync{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.sync span:not(.dot){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync.busy .dot{background:var(--accent);animation:blink 1s infinite}
.sync.bad{color:var(--bad)} .sync.bad .dot{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
.nav{position:fixed;z-index:6;inset:auto 0 0 0;max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;color:var(--muted)}
.nav a.on{color:var(--primary);font-weight:600}
.nav a.on svg{transform:translateY(-1px)}

/* type */
.h1{font-size:clamp(22px,5.5vw,28px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.h2{font-size:16px;margin:0;font-weight:700}
.h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.h3 svg{width:16px;height:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.app[dir="rtl"] .eyebrow{letter-spacing:0}
.note{font-size:13.5px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line);border-radius:12px;margin:0}
.empty{color:var(--muted);margin:0}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.block{display:flex;flex-direction:column;gap:10px}
.center{text-align:center;align-items:center;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center} .wrap{flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.center-row{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14.5px;min-height:42px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.ghost{background:transparent}
.btn.big{padding:13px 20px;font-size:16px;min-height:50px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.sm svg{width:16px;height:16px}
.btn.done{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.85;cursor:default}
.btn.primary[disabled]{opacity:.45}
.linkbtn{color:var(--primary);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--bad)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface2);flex:none}
.app[dir="rtl"] .iconbtn svg[data-flip], .app[dir="rtl"] .lhead .iconbtn svg, .app[dir="rtl"] .phead .iconbtn svg{transform:scaleX(-1)}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.ok,.chip.st-mastered{background:var(--ok-soft);color:var(--ok)}
.chip.warn,.chip.st-learning{background:var(--accent-soft);color:var(--warn)}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track.sm{height:5px}
.track i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.app[dir="rtl"] .track{transform:scaleX(-1)}
.lvl{display:inline-block;font-family:var(--f-de);font-weight:800;font-size:13px;padding:3px 10px;border-radius:8px;background:var(--fg);color:var(--bg);letter-spacing:.02em}

/* home */
.hero{background:var(--grad,linear-gradient(150deg,#F2542D 0%,#C2338A 55%,#5B2BC4 100%));color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.hero .eyebrow{color:#FFE7A3}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.hero .lvl{background:var(--hl);color:#1E1A10}
.hero-title{font-size:clamp(24px,6.5vw,34px);margin:2px 0 0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.hero-sub{margin:0;opacity:.88;font-size:14px}
.hero .btn.primary{background:var(--hl);color:#1E1A10;border-color:var(--hl);align-self:flex-start}
.goalbar{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.goalbar .gl{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.goalbar .track{background:rgba(255,255,255,.18)} .goalbar .track i{background:#FFD37A}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-de);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile b small{font-size:14px;color:var(--muted);font-weight:600}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.hot{border-color:var(--accent);background:var(--accent-soft)}
.tile .track{margin-top:6px}
.chart{display:flex;flex-direction:column;gap:4px}
.chart .plot{position:relative;height:var(--h);display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;height:100%;display:flex;align-items:flex-end}
.chart .col i{display:block;width:100%;background:color-mix(in srgb,var(--primary) 55%,var(--surface2));border-radius:4px 4px 1px 1px;transition:height .4s}
.chart .col.today i{background:var(--accent)}
.chart .goal{position:absolute;inset-inline:0;border-top:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);pointer-events:none}
.chart .goal em{position:absolute;top:-17px;right:0;font-style:normal;font-size:10.5px;color:var(--muted);background:var(--surface);padding:0 4px}
.chart .xax{display:flex;gap:4px;font-size:11px;color:var(--muted)}
.chart .xax span{flex:1;text-align:center;min-width:0;overflow:hidden}

/* lessons */
.phead{display:flex;flex-direction:column;gap:8px}
.backbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface2);color:inherit;text-decoration:none;font-weight:600;font-size:15px;flex:none}
.backbtn svg{width:20px;height:20px}
.app[dir="rtl"] .backbtn{padding:0 10px 0 14px}
.app[dir="rtl"] .backbtn svg{transform:scaleX(-1)}
.lhead:has(.backbtn){flex-direction:column;gap:8px}
.phead:has(.iconbtn){flex-direction:row;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap;font-weight:600;color:var(--muted)}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lcard{position:relative;display:flex;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--primary)}
.lcard:active{transform:scale(.99)}
.lnum{font-family:var(--f-de);font-weight:800;font-size:22px;color:var(--primary);line-height:1;min-width:30px;padding-top:2px}
.lbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.ltopic{font-size:12px;color:var(--muted)}
.ltitle{font-weight:700;font-size:16.5px;line-height:1.3;text-align:start}
.lmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:2px}
.lbar{position:absolute;inset:auto 0 0 0;height:3px;background:var(--surface2)}
.lbar i{display:block;height:100%;background:var(--ok)}

/* lesson */
.lhead{display:flex;gap:12px;align-items:flex-start}
.lhead-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lhead .h1{text-align:start}
.lsum{margin:-6px 0 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);padding:4px;border-radius:14px;gap:4px}
.tab{padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
#lbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.player{background:#0F1E23;color:#EEF4F5;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;
  background-image:radial-gradient(120% 80% at 100% 0%,rgba(77,184,192,.28),transparent 60%),radial-gradient(80% 60% at 0% 100%,rgba(235,180,70,.18),transparent 70%)}
.cast{display:flex;gap:8px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px;transition:background .2s}
[dir="rtl"] .who{padding:3px 3px 3px 10px}
.who i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-style:normal;font-weight:800;font-size:12px}
.who.talk{background:#EBB446;color:#241800}
.stage{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center;cursor:pointer;padding:6px 4px}
.spk{font-size:12px;color:#EBB446;font-weight:600}
.de-line{font-size:clamp(20px,5.4vw,26px);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.ar-line{margin:0;font-size:16px;color:rgba(238,244,245,.82);text-wrap:balance}
.de-hidden{display:none;margin:0;font-size:15px;color:rgba(238,244,245,.7);border:1px dashed rgba(255,255,255,.25);border-radius:12px;padding:16px}
.player.hide-de .de-line{display:none} .player.hide-de .de-hidden{display:block}
.player.hide-ar .ar-line{display:none}
.w{border-radius:4px;transition:color .12s,background .12s}
.w.on{color:#EBB446}
.dots{display:flex;gap:4px}
.dot{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.dot.done{background:rgba(255,255,255,.6)} .dot.now{background:#EBB446}
.pctl{display:flex;align-items:center;justify-content:center;gap:10px}
.pctl .iconbtn{background:rgba(255,255,255,.1);color:#EEF4F5}
.playbtn{width:60px;height:60px;border-radius:50%;background:#EEF4F5;color:#0F1E23;display:grid;place-items:center}
.playbtn svg{width:26px;height:26px}
.speed select{background:rgba(255,255,255,.1);color:#EEF4F5;border:0;border-radius:10px;padding:9px 8px;font-family:var(--f-de);font-weight:700}
.speed option{color:#111}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);cursor:pointer}
.tgl input{accent-color:#EBB446;width:16px;height:16px;margin:0}
.demo{margin:0;font-size:11.5px;color:rgba(238,244,245,.6);text-align:center}
.hint{margin:0;font-size:13px}
.transcript{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tline{display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s}
.tline.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] .tline.now{box-shadow:inset -3px 0 0 var(--accent)}
.tspk{font-size:11.5px;color:var(--primary);font-weight:600}
.tde{font-size:16px;font-weight:600;line-height:1.4;text-align:left}
.tar{font-size:14px;color:var(--muted);text-align:right}
.transcript.hide-de .tde{filter:blur(6px);user-select:none}
.transcript.hide-ar .tar{display:none}
.lnav{display:flex;justify-content:space-between;gap:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,14,.5);z-index:20}
.sheet{position:fixed;z-index:21;inset:auto 0 0 0;max-width:760px;margin:0 auto;max-height:88%;overflow-y:auto;background:var(--surface);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-x{position:absolute;top:12px;inset-inline-end:14px}
.sheet p{margin:0 0 6px}
.big-de{font-size:clamp(21px,5.6vw,26px);font-weight:600;line-height:1.35;margin:8px 0 4px!important;text-align:left;padding-inline-end:40px}
.big-ar{font-size:17px;color:var(--muted);text-align:right}
.reg{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.reg-f{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.reg-n{background:var(--surface2);color:var(--muted)}
.reg-i{background:var(--accent-soft);color:var(--warn)}
.vlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surface2)}
.vlist li>span{display:flex;flex-direction:column;min-width:0}
.vlist small{color:var(--muted);font-size:13px}
.exbox{padding:12px 14px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.exbox p[lang="de"]{font-weight:600}
.rec{margin-top:10px;padding-top:4px;border-top:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.cmp>div{padding:12px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp-de{font-weight:600}
audio{width:100%}

/* exercises */
.excard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
#qbody{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#qbody>.btn{align-self:flex-start}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:0;text-align:left}
.gap{display:inline-block;min-width:3em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{padding:12px 14px;border-radius:12px;font-size:14.5px}
.fb p{margin:4px 0 0}
.fb.good{background:var(--ok-soft)} .fb.good b{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad b{color:var(--bad)}
.fb.mixed{background:var(--accent-soft)}
.fb .linkbtn{margin-top:6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;line-height:1.35;min-height:48px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.mt.locked{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);opacity:.85}
.mt.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.answer,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px}
.answer{border:1.5px dashed var(--line);background:var(--surface2)}
.answer.right{border-color:var(--ok);background:var(--ok-soft)}
.answer.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.tok{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.tok[disabled]{opacity:.3}
.tok.on{border-color:var(--primary)}
.solution{margin:0;font-weight:600;color:var(--ok)}
.result .ring{--p:0;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0)}
.result .ring b{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-de);font-size:26px}
.exprs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.exprs li{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.exprs li .row-between{width:100%}
.exprs p{margin:0}
.xde{font-size:17px}

/* vocab */
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.vbook{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;gap:10px;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.vmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.vmain b{font-size:16px}
.vmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:4px}
.vact{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.flash{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 18px}
.fde{font-size:clamp(22px,6vw,30px);font-weight:700;margin:0;line-height:1.3}
.far{font-size:19px;margin:0}
#fBack{display:flex;flex-direction:column;gap:4px}
#fBack[hidden]{display:none}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.rates[hidden]{display:none}
.rate{padding:11px 4px;border-radius:12px;font-weight:700;font-size:13.5px;border:1.5px solid var(--line)}
.rate.r0{color:var(--bad);border-color:var(--bad)} .rate.r1{color:var(--warn)} .rate.r2{color:var(--primary);border-color:var(--primary)} .rate.r3{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.big{font-size:17px;margin:0}

/* stats */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.stack i{display:block}
.s-new{background:var(--line)} .s-learning{background:var(--accent)} .s-mastered{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.kbars{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.kbars li{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.kb{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.kb i{display:block;height:100%;background:var(--bad)}
.wlist{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.wlist a{display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px}
.wlist a span[lang="de"]{text-align:left}

/* profile */
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14.5px;flex-wrap:wrap}
.form select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);min-width:150px}
.accname{font-weight:700;font-size:17px;margin:0}
.accname:empty{display:none}
.card p{margin:0}

/* gate + onboarding */
.splash,.gate,.onb{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.splash{align-items:center;padding:60px 0}
.onb fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.onb legend{font-weight:700;margin-bottom:6px;font-size:14px}
.pick{cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick span{display:inline-block;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pick input:checked+span{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.pick input:focus-visible+span{outline:2.5px solid var(--accent)}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:min(92vw,460px);
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet>.eyebrow{display:block;padding:0 52px;text-align:center}
/* video lessons */
.vbox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.vbox iframe,.vbox #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;background:rgba(6,16,19,.88);color:#EEF4F5;font-size:14px}
.vmsg[hidden]{display:none}
.vmsg .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#EEF4F5}
.vplayer .stage{min-height:110px}
.demo a{color:#EBB446;text-decoration:underline}
.chip.vid{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
textarea.search{resize:vertical;font-family:var(--f-de);line-height:1.5}
.form>label[for]{margin-bottom:-6px}
code{font-size:12px;background:var(--surface2);padding:1px 6px;border-radius:6px}

.au-err{color:var(--bad);font-weight:600}
.gate .form{width:100%}
.gate input{font-size:16px}

/* ===== clip feed: full-height cards that snap, like a short-video app ===== */
body.feedmode{overflow:hidden}
body.feedmode .app{max-width:none}
.feed{position:relative;height:calc(100dvh - 58px - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;
  background:var(--feed,#120A1C);color:#fff;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.ftop{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;height:0;overflow:visible}
.fcount{margin-inline-end:auto;font-size:12px;font-weight:600;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px;margin-top:22px}
.fchip2{margin-top:22px;min-width:40px;height:32px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:13px;border:1.5px solid rgba(255,255,255,.35)}
.fchip2.on{background:var(--hl);color:#1E1A10;border-color:var(--hl)}
.fcard{scroll-snap-align:start;scroll-snap-stop:always;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  background:radial-gradient(120% 70% at 50% 0%,var(--glow,#3B1E52) 0%,var(--feed,#120A1C) 75%)}
.fvid{position:relative;aspect-ratio:16/9;width:100%;background:#000 center/cover no-repeat;flex:none}
.fyt,.fyt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fplay{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .2s,transform .2s;z-index:2}
.fplay svg{width:34px;height:34px}
.fcard.playing .fplay{opacity:0;transform:scale(.8);pointer-events:none}
.fcard.playing .fvid::after{content:"";position:absolute;inset:0;z-index:1}
.fmsg{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(18,10,28,.86);font-size:14px}
.finfo{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px;min-height:0;overflow:auto}
.fend .finfo{justify-content:center;align-items:center;text-align:center}
.fsrc{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--hl);text-transform:uppercase}
.fsrc i{font-style:normal;color:rgba(255,255,255,.7);text-transform:none;font-weight:500}
.fde{font-family:var(--f-de);font-weight:800;font-size:clamp(21px,5.6vw,30px);line-height:1.28;margin:0;letter-spacing:-.01em}
.fde mark{background:var(--hl);color:#1E1A10;border-radius:6px;padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.far{margin:0;font-size:16px;color:rgba(255,255,255,.88)}
.feed.hide-de .fde{filter:blur(9px);user-select:none}
.feed.hide-ar .far{display:none}
.fkey{display:grid;gap:2px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.fkey .eyebrow{color:rgba(255,255,255,.65);font-size:11px}
.fkey b{font-family:var(--f-de);font-size:19px;color:var(--hl)}
.fkey span:last-child{color:rgba(255,255,255,.92)}
.fact{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.09);color:#fff;font-size:12px;font-weight:600;transition:transform .15s,background .15s}
.fact button:active{transform:scale(.94)}
.fact button b{font-size:15px;line-height:20px}
.fact button.on,.fact button.done{background:var(--primary);color:#fff}
.fact svg{width:22px;height:22px}
@media (min-width:900px){.fcard{flex-direction:row;max-width:1100px;align-items:stretch}.fvid{aspect-ratio:auto;flex:1.4}.finfo{flex:1}}
body.feedmode main{padding:0}
.fbar{position:absolute;inset:auto 0 0 0;height:4px;background:rgba(255,255,255,.18);z-index:2}
.fbar i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s linear}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flen{font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:99px}
.ftitle{margin:0;font-family:var(--f-de);font-size:15px;font-weight:700;color:rgba(255,255,255,.9)}
.finfo>*{flex-shrink:0}
.fline{display:block;text-align:start;background:rgba(255,255,255,.06);border-radius:18px;padding:14px;min-height:118px}
.fline .fde{margin-bottom:6px}
.fkeys{display:flex;flex-wrap:wrap;gap:8px}
.fk{display:flex;flex-direction:column;align-items:flex-start;padding:7px 11px;border-radius:14px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);color:#fff;font-size:12px;max-width:100%}
.fk b{color:var(--hl);font-size:14px}
.fk.done{background:var(--primary);border-color:var(--primary)} .fk.done b{color:#fff}
.fact a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.09);color:#fff;font-size:12px;font-weight:600}
.fact a svg{width:22px;height:22px}

/* ===== C1 health section ===== */
.c1card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#0C6670 0%,#2A9D8F 60%,#8AC926 100%);color:#fff;box-shadow:var(--shadow)}
.c1card .lvl{background:#FFD23F;color:#24143A;flex:none}
.c1card small{opacity:.9}
.hvbody{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hvbody b{font-size:15px;line-height:1.3}
.hvbody small{font-size:12.5px;color:inherit;opacity:.75}
.phead .h1 .lvl{vertical-align:middle;font-size:14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hvid .hvbody b{font-size:13.5px}
.hvid{display:flex;flex-direction:column;gap:8px;text-align:start;padding:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:inherit;font:inherit;cursor:pointer}
.hvid:hover{border-color:var(--primary)}
.hvid .hvbody{padding:0 12px}
.hthumb{position:relative;display:block;aspect-ratio:16/9;background:#222 center/cover no-repeat}
.hthumb em{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.75);color:#fff;font-style:normal;font-size:12px;padding:2px 6px;border-radius:6px;direction:ltr}
.hthumb i{position:absolute;top:6px;inset-inline-start:6px;background:#2A9D8F;color:#fff;font-style:normal;font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.hvid.seen{opacity:.85}
.htopic{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.htopic:hover{border-color:var(--primary)}
.hic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);flex:none}
.hplayer{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
.hplayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hctl{align-items:center;margin:10px 0 4px}
.hitems{list-style:none;padding:0;margin:8px 0 16px;display:flex;flex-direction:column;gap:10px}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,box-shadow .2s}
.hitem.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--accent-soft)}
.hde{font-size:18px;font-family:var(--f-de)}
.har{margin:0}
.hdef{margin:0;font-size:13.5px;color:var(--muted);font-style:italic}
.hex{list-style:none;padding:0;margin:4px 0;display:flex;flex-direction:column;gap:8px}
.hex li{display:flex;gap:8px;align-items:flex-start}
.hex li>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.hxde mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px}
.hex small{color:var(--muted)}
.hide-ar .har{filter:blur(6px);cursor:pointer;transition:filter .2s}
.hide-ar .har:hover,.hide-ar .har:active{filter:none}

/* lesson covers */
.lcover{position:relative;flex:0 0 76px;height:76px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--hue,20) 75% 58%),hsl(calc(var(--hue,20) + 40) 70% 42%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.lcover svg{width:38px;height:38px;opacity:.95}
.lcover.photo{background-size:cover;background-position:center;background-color:var(--line)}
.lcover em{position:absolute;bottom:4px;inset-inline-end:6px;font-style:normal;font-weight:800;font-size:12px;font-family:var(--f-de);background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:1px 5px}
/* dictation */
.dictin{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);resize:vertical;text-align:left}
.dictin:focus{outline:2px solid var(--primary);outline-offset:1px}
.umls{display:flex;flex-wrap:wrap;gap:6px}
.umls .tok{min-width:38px}
.dictres{font-size:17px;line-height:1.7;margin:0;text-align:left}
.dictres .dok{color:var(--ok);font-weight:600}
.dictres .dnear{background:rgba(245,190,40,.3);border-radius:4px;padding:0 2px}
.dictres .dbad{color:var(--bad,#c0392b);text-decoration:line-through}
.dictres sup{color:var(--ok);font-weight:700;margin-inline-start:2px}
/* recorder */
.btn.recording{background:#d93a3a;border-color:#d93a3a;color:#fff;animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 6px rgba(217,58,58,.25)}}
/* legal */
.legal ul{padding-inline-start:20px;margin:6px 0 12px}
.legal p{margin:6px 0 12px}
.placecard .row-between{gap:12px;align-items:center}
.pltext{margin:0;padding:12px 14px;border-inline-start:4px solid var(--primary);background:var(--bg);border-radius:10px;font-size:17px;line-height:1.55;text-align:left}
.opt[lang="ar"]{text-align:right}
.fadd{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;text-decoration:none;margin-top:22px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.fcard.loading .fplay{animation:recpulse 1s ease-in-out infinite}

/* profile: colour and font pickers */
.lookpick{display:grid;gap:8px}
.lookpick>span{font-weight:600}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;background:var(--surface2);border:2px solid transparent;font-size:13px;font-weight:600;color:var(--fg)}
.swatch i{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--s1) 0 50%,var(--s2) 0 80%,var(--s3) 0);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatch.on{border-color:var(--primary);background:var(--surface)}
.fontsample{margin:0;font-size:20px;font-weight:700;padding:10px 14px;border-radius:12px;background:var(--surface2)}

/* ----- word types, long-press card, word practice ----- */
.w{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.w.pressing{background:var(--accent-soft);transition:background .15s .18s}
.wv,.wa,.wd{font-size:1.08em;font-weight:700}
.wv{color:var(--wv)} .wa{color:var(--wa)} .wd{color:var(--wd)}
.feed .wv{color:#86B6FF} .feed .wa{color:#FFB46B} .feed .wd{color:#D9A2FF}
.no-wcolors .wv,.no-wcolors .wa,.no-wcolors .wd{color:inherit;font-size:inherit;font-weight:inherit}
.w.on{color:#EBB446}
.wlegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.no-wcolors .wlegend .wtag{display:none}
.wtag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid currentColor;line-height:1.5}
.wt-v{color:var(--wv)} .wt-a{color:var(--wa)} .wt-d{color:var(--wd)} .wt-n,.wt-i,.wt-p,.wt-f{color:var(--muted)}
.wscrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80}
.wcard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));max-height:72vh;overflow:auto;

    [15.9, "A", "Ja, irgendwie vielleicht. Wegen der Arbeit, die Sie jetzt damit haben, aber das müssen Sie doch nicht sagen. Warum sagen Sie so was? So eine Floskel.", "ربما نوعاً ما. بسبب العمل الذي ستتحمله الآن، لكن لا داعي أن تقول ذلك. لماذا تقول شيئاً كهذا؟ عبارة فارغة.", "n",

      [["die Floskel", "العبارة الجاهزة الفارغة"]], ["Seine Rede bestand nur aus Floskeln.", "خطابه كان مجرد عبارات فارغة."]],
    [22.3, "A", "Der ist halt eine Brücke. Der Satz, der leitet über zu dem schlimmen Teil, weil der ohne die Brücke zu brutal wäre. Gefühllos.", "إنها جسر. الجملة تمهّد للجزء السيئ، لأنه بدون الجسر سيكون قاسياً جداً. بلا مشاعر.", "n",
      "«zu etwas überleiten» = يمهّد / ينتقل إلى. «wäre» = Konjunktiv II لوصف حالة افتراضية.", "«überleiten zu» = den Übergang schaffen; «wäre» = Konjunktiv II.",

    [28.2, "A", "Ja, da kann man die doch auch weglassen, die Brücke. Man weiß sowieso schon, was kommt. Der Tod ist doch keine Insel. Da brauchst du keine Brücke. Ist Festland. Der Tod, der gehört dazu.", "إذاً يمكن الاستغناء عنها، عن الجسر. الكل يعرف ما الذي سيأتي. الموت ليس جزيرة. لا تحتاج جسراً. إنه يابسة. الموت جزء من الحياة.", "n",
      "يكمل الاستعارة بذكاء: Insel/Festland. «weglassen» = يحذف. «dazugehören» = جزء من.", "Er spielt mit der Metapher Insel/Festland; «weglassen» = auslassen.",

    [37.4, "A", "Nee, nee, nee, stellen Sie sich mal vor, Sie klingeln bei einer Witwe, die noch gar nicht weiß, dass sie Witwe ist. Die macht die Tür auf, hat noch den Putzlappen in der Hand, und Sie sagen als Erstes: „Hallo, Ihr Mann ist tot.“ Das nennt man Empathie.", "لا، لا، لا، تخيّل أنك تدق جرس أرملة لا تعرف بعد أنها أرملة. تفتح الباب وما زالت خرقة التنظيف في يدها، وأنت تقول أولاً: «مرحباً، زوجك مات». هذا ما تسميه تعاطفاً؟", "n",
      "«Stellen Sie sich mal vor, …» = تخيّل… طريقة قوية لإقناع الآخر بمثال. الجملة الأخيرة ساخرة.", "«Stellen Sie sich vor …» = Argument mit Beispiel; der Schluss ist ironisch.",
      [["sich etwas vorstellen", "يتخيل شيئاً"], ["die Witwe", "الأرملة"], ["die Empathie", "التعاطف"]], ["Stell dir mal vor, du verlierst deinen Job.", "تخيّل أنك فقدت عملك."]],
    [48.6, "A", "Ich finde es eher interessant, dass Sie sich frische Witwen mit einem Putzlappen vorstellen. Ist das nicht unfeministisch?", "أنا أجد المثير للاهتمام أكثر أنك تتخيل الأرامل الجدد مع خرقة تنظيف. أليس هذا ضد النسوية؟", "n",
      "«Ich finde es eher interessant, dass …» = طريقة ذكية لتحويل النقاش إلى نقطة ضعف عند الآخر.", "«Ich finde es eher interessant, dass …» lenkt das Gespräch auf eine Schwäche des anderen.",
      [["eher", "بالأحرى / أكثر"], ["Ich finde es …, dass …", "أجد أن…"]], ["Ich finde es eher seltsam, dass niemand gefragt hat.", "أجد من الغريب بالأحرى أن أحداً لم يسأل."]],
    [55.5, "A", "Ja, was soll die denn sonst in der Hand halten? Eine Spielkonsole?", "طيب، وماذا ستحمل في يدها غير ذلك؟ جهاز ألعاب؟", "i",
      "«Was soll … denn sonst …?» سؤال بلاغي يدافع به عن نفسه.", "Rhetorische Frage zur Verteidigung.", [["sonst", "غير ذلك"]], null]

  lines: [

    [66.8, "Mein Gott! – Kinderspiel! – Ja, klar. – Aber ich konnte das nicht! Ich hatte das Meerschweinchen schon in der Hand.", "يا إلهي! – لعبة أطفال! – طبعاً. – لكنني لم أستطع! كان خنزير الغينيا في يدي."],

    [67.5, "Für dich. Weil dich hier keiner leiden kann. Ich kann dich leiden, deshalb habe ich Tofu gekauft. Kann ich was draus machen, zum Beispiel Tofu. – Mensch.", "لك أنت. لأن لا أحد هنا يحبك. أنا أحبك، لذلك اشتريت التوفو. أستطيع أن أصنع منه شيئاً، مثلاً… توفو. – يا رجل."],
    [80.0, "Du bist doch der Teufel. Du säst Zweifel. – Ich säe gar nichts. Und keine Hörner habe ich, keinen großen Mund und keine langen Finger. Ich habe eher kurze. – Ziemlich kurze. – Jetzt mal nicht übertreiben, ne. – Winzig und wurstig.", "أنت الشيطان بعينه. تزرع الشك. – لا أزرع شيئاً. وليس عندي قرون، ولا فم كبير، ولا أصابع طويلة. أصابعي قصيرة بالأحرى. – قصيرة جداً. – لا تبالغ الآن. – صغيرة ومنتفخة كالنقانق."],

    [124.5, "Also ich habe noch nie jemanden gesehen, wo ich gedacht hätte: „Ach du Scheiße, zu viel Soja.“ Bei Bier zum Beispiel ist das was anderes, aber da regt sich ja auch keiner auf.", "أنا لم أرَ أبداً أحداً وقلت: «يا للهول، صويا أكثر من اللازم». مع البيرة مثلاً الأمر مختلف، لكن لا أحد ينزعج من ذلك."],
    [133.0, "Ich verstehe einfach nicht, dass die Leute nicht miteinander reden. Man hätte sich doch alles sparen können, aber alle haben einfach Angst, miteinander zu reden. Also gibt's Missverständnisse und Lügen und noch mehr Angst, und am Ende steht man alleine da.", "لا أفهم ببساطة لماذا لا يتكلم الناس مع بعضهم. كان يمكن تجنّب كل شيء، لكن الجميع يخاف أن يتكلم مع الآخر. فتحدث سوء تفاهمات وأكاذيب ومزيد من الخوف، وفي النهاية يبقى الإنسان وحيداً."],

let saveTimer = null, writing = false, syncState = "ok";

/* ================= back navigation =================
   Every screen and every open sheet is its own browser-history entry, so the phone's Back button
   (browser or Android app) steps back inside DeutschFlow instead of leaving it. navIdx counts how
   many of our own entries lie behind the current one; at 0 there is nothing of ours to go back to. */
let navIdx = 0, navInit = false;
const PARENT = { lesson: "lessons", htopic: "health", health: "lessons", addclip: "lessons", review: "vocab", wordtrain: "vocab", placement: "profile", legal: "profile" };
function syncNav() {
  const st = history.state;
  if (st && typeof st.dfi === "number") navIdx = st.dfi;
  else { navIdx = navInit ? navIdx + 1 : 0; try { history.replaceState({ dfi: navIdx }, "", location.href); } catch (e) {} }
  navInit = true;
}
// Go to another screen, replacing the current entry instead of adding one (used when leaving a sheet or when nothing is behind us).
function navReplace(h) {
  if (!$("#sheet").hidden) closeSheet();
  try { history.replaceState({ dfi: navIdx }, "", "#" + h); } catch (e) { location.replace("#" + h); return; }
  render();
}
// One step back. Returns false when there is nothing left inside the app (the Android app may then close).
function goBack() {
  if (!$("#sheet").hidden) { dismissSheet(); return true; }
  if (navIdx > 0) { history.back(); return true; }
  const parent = PARENT[route().name];
  if (parent) { navReplace(parent); return true; }
  return false;
}
addEventListener("popstate", e => {
  const st = e.state || {}, prev = navIdx;
  if (typeof st.dfi === "number") navIdx = st.dfi;
  if (!st.sheet && !$("#sheet").hidden) closeSheet();
  // An old sheet entry whose sheet is already gone: skip over it so Back never seems to do nothing.
  else if (st.sheet && $("#sheet").hidden) { if (navIdx < prev) history.back(); else history.forward(); }
});
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("[data-back]");
  if (!a) return;
  e.preventDefault(); goBack();
});
const backBtn = parent => `<a class="backbtn" href="#${parent}" data-back>${IC.back}<span>${esc(t("back"))}</span></a>`;
// Android app: the hardware/gesture Back button. Without this listener Android closes the whole app.
(function nativeBack() {
  const C = window.Capacitor, A = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.App;
  if (!A || !A.addListener) return;
  try { A.addListener("backButton", () => { if (!goBack()) { try { A.exitApp(); } catch (e) {} } }); } catch (e) {}
})();

/* Clips YouTube refused to play on this device (removed, embedding off, or blocked in this country, e.g. many ARD clips
   outside DE/AT/CH). They are left out of the feed and of caption fetching here; tried again after 7 days. */
const UNPLAY_KEY = "df_unplayable_v1";
function unplayMap() { try { return JSON.parse(localStorage.getItem(UNPLAY_KEY) || "{}"); } catch (e) { return {}; } }
const isUnplayable = yt => { const t0 = unplayMap()[yt]; return !!t0 && Date.now() - t0 < 7 * 864e5; };
function markUnplayable(yt) { const m = unplayMap(); m[yt] = Date.now(); try { localStorage.setItem(UNPLAY_KEY, JSON.stringify(m)); } catch (e) {} }

/* Scenes listed only by YouTube id (window.DF_AUTO). In the Android app the phone reads YouTube's own German captions,
   translates them to Arabic by machine (free), keeps the result on this device, and the scene joins the feed. */
const AUTO_KEY = "df_auto_v1";
function autoCache() { try { return JSON.parse(localStorage.getItem(AUTO_KEY) || "{}"); } catch (e) { return {}; } }
function autoSave(c) { try { localStorage.setItem(AUTO_KEY, JSON.stringify(c)); } catch (e) {} }
function autoCards() {
  const c = autoCache();
  return (window.DF_AUTO || []).filter(a => c[a.yt] && c[a.yt].lines && c[a.yt].lines.length >= 3).map(a => {
    const x = c[a.yt];
    return { id: "a-" + a.yt, yt: a.yt, start: x.lines[0][0], end: x.end, src: a.src, title: a.title, lines: x.lines, keys: [], auto: true, mt: true };
  });
}
const autoPending = () => { const c = autoCache(), now = Date.now(); return (window.DF_AUTO || []).filter(a => !isUnplayable(a.yt) && (!c[a.yt] || (c[a.yt].fail && now - c[a.yt].fail > 3 * 864e5))); };
let autoBusy = false;
async function autoFill(max = 6) {
  if (autoBusy || !NATIVE_HTTP()) return 0;
  autoBusy = true; let added = 0;
  try {
    for (const a of autoPending().slice(0, max)) {
      const c = autoCache();
      try {
        const r = await fetchYtTranscript(a.yt);
        if (r.reason === "offline") break; // no connection: try again another time
        const ls = r.lines.filter(x => x.t < (a.len || 900)).slice(0, 150);
        if (ls.length < 3) { c[a.yt] = { fail: Date.now() }; autoSave(c); continue; }
        const ar = await translateLinesAr(ls.map(x => x.de));
        const last = ls[ls.length - 1];
        c[a.yt] = { lines: ls.map((x, i) => [x.t, x.de, ar[i] || ""]), end: Math.min(a.len || 9999, last.t + 6), asr: !!r.auto, at: Date.now() };
        autoSave(c); added++;
      } catch (e) { c[a.yt] = { fail: Date.now() }; autoSave(c); }
    }
  } finally { autoBusy = false; }
  if (added) FEED = [];
  return added;
}

// One card per video lesson, plus stand-alone scenes in window.DF_FEED ({id, yt, start, end, src, lines:[[t, de, ar]], keys:[[de, ar]], auto}).
let FEED = [];
function buildFeed() {
  const fromLessons = LESSONS.filter(l => l.video).map(l => ({
    id: l.id, yt: l.video.yt, start: l.video.start ?? l.video.t[0], end: l.video.end, src: l.src || ["", ""], title: l.title, lesson: l.id,
    lines: l.L.map((x, i) => [l.video.t[i], x[1], x[2]]), keys: (l.E || []).map(([d, a]) => [d, a])
  }));
  const extra = (window.DF_FEED || []).concat(autoCards()).map(c => ({ ...c, src: c.src || ["", ""], keys: c.keys || [] }));
  const covered = new Set(extra.map(c => c.yt));
  const rest = fromLessons.filter(c => !covered.has(c.yt));
  FEED = [];
  const n = Math.max(rest.length, extra.length);
  const ok = c => !isUnplayable(c.yt);
  extra.splice(0, extra.length, ...extra.filter(ok)); rest.splice(0, rest.length, ...rest.filter(ok));
  for (let i = 0; i < n; i++) { if (extra[i]) FEED.push(extra[i]); if (extra[i + n]) FEED.push(extra[i + n]); if (rest[i]) FEED.push(rest[i]); }
  // Clips the person added themselves come first, newest on top.
  FEED.unshift(...CUSTOM.slice().reverse().map(l => ({ id: l.id, yt: l.video.yt, start: l.video.start, end: l.video.end, src: ["", t("my_clip_src")], title: l.title, lesson: l.id,
    lines: l.L.map((x, i) => [l.video.t[i], x[1], x[2]]), keys: [] })));
}

function healthQuiz(tp) {
  const Q = [];
  const withGap = tp.items.flatMap(it => it.x.filter(x => /\*[^*]+\*/.test(x[0])).slice(0, 1).map(x => ({ it, x, ans: x[0].match(/\*([^*]+)\*/)[1] })));
  const answers = [...new Set(withGap.map(g => g.ans))];
  const gaps = shuffle(withGap).slice(0, 6);
  gaps.forEach(g => {
    const others = shuffle(answers.filter(a => a.toLowerCase() !== g.ans.toLowerCase())).slice(0, 2);
    if (others.length < 2) return;
    Q.push({ k: "gap", q: g.x[0].replace(/\*[^*]+\*/, "___"), o: [g.ans, ...others], a: 0,
      w: [`«${g.it.d}» = ${g.it.a}.${g.it.n ? " " + g.it.n : ""} — ${g.x[1]}`, `«${g.it.d}»: ${g.it.f || ""}`] });
  });
  const pairs = shuffle(tp.items.filter(it => it.d.length <= 42));
  for (let i = 0; i + 4 <= pairs.length && i < 8; i += 4)
    Q.push({ k: "match", p: pairs.slice(i, i + 4).map(it => [it.d, it.a]), w: ["كل تعبير مع معناه بالعربية.", "Jeder Ausdruck mit seiner Bedeutung."] });
  const ord = shuffle(tp.items.flatMap(it => it.x.map(x => ({ it, s: unstar(x[0]).replace(/\s+/g, " ").trim(), ar: x[1] })))
    .filter(o => { const n = o.s.split(" ").length; return n >= 5 && n <= 11 && !/[„“]/.test(o.s); })).slice(0, 3);
  ord.forEach(o => Q.push({ k: "order", s: o.s, w: [o.ar, o.it.f || ""] }));
  const order = { gap: 0, match: 1, order: 2 };
  return Q.sort((a, b) => order[a.k] - order[b.k]);
}

function ttsEngine(l, { player, show, setPlaying, listened }) {
  const sayLine = async (i, my) => {
    show(i, true);
    const x = l.L[i]; const deEl = $(".de-line", player);
    await speak(x[1], { g: l.sp[x[0]][1], onWord: highlighter(deEl) });
    if (my === speechRun) clearHl(deEl);
  };
  const play = async i => {
    stopSpeech(); const my = speechRun; setPlaying(true);
    for (let j = i; j < l.L.length; j++) {
      await sayLine(j, my);
      if (my !== speechRun) return;
      await wait(S.profile.rate < 1 ? 650 : 380);
      if (my !== speechRun) return;
    }
    setPlaying(false); listened();
  };
  return {
    play, pause: () => { if (speaking || LS.playing) { speechRun++; if (synth) synth.cancel(); speaking = false; } setPlaying(false); },
    repeat: i => { stopSpeech(); const my = speechRun; sayLine(i, my); },
    cue: () => {}, setRate: () => { if (LS.playing) play(LS.cur); }, destroy: () => {}
  };
}

/* YouTube IFrame player. Only the official embed is used: the clip stays on YouTube's servers. */
let ytApi = null;
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (ytApi) return ytApi;
  ytApi = new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error("timeout")), 9000);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { clearTimeout(to); if (prev) prev(); res(window.YT); };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => { clearTimeout(to); rej(new Error("blocked")); };
    document.head.appendChild(s);
  });
  ytApi.catch(() => { ytApi = null; });
  return ytApi;
}
function videoEngine(l, v, { player, show, setPlaying, listened, rate }) {
  let yp = null, ready = false, timer = null, stopAt = null, dead = false, pendingPlay = null;
  const msg = $("#vmsg", player);
  const lineEnd = i => v.t[i + 1] ?? v.end ?? null;
  const fail = code => {
    const p = LP(l.id); p.videoError = code; p.videoErrorAt = Date.now(); save("progress");
    const unavailable = [100, 101, 150].includes(code);
    if (unavailable) markUnplayable(v.yt);
    msg.hidden = false;
    msg.innerHTML = `<b>${esc(t(unavailable ? "video_gone" : "video_blocked"))}</b><span>${esc(t("video_gone_sub"))}</span>
      <a class="btn sm" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.yt)}&t=${Math.floor(v.start || 0)}s" target="_blank" rel="noopener">YouTube</a>
      ${l.custom ? "" : `<button class="btn sm" id="vFallback">${esc(t("video_use_audio"))}</button>`}`;
    const fb = $("#vFallback", msg);
    if (fb) fb.onclick = () => { l._videoFailed = true; renderLessonTab(l); };
    setPlaying(false);
  };
  const tick = () => {
    if (!ready || dead) return;
    let tt = 0; try { tt = yp.getCurrentTime(); } catch (e) { return; }
    let i = 0; v.t.forEach((x, j) => { if (x <= tt + 0.08) i = j; });
    if (i !== LS.cur) show(i, LS.playing);
    if (stopAt !== null && tt >= stopAt - 0.05) { yp.pauseVideo(); stopAt = null; }
    if (v.end && tt >= v.end - 0.05) { yp.pauseVideo(); listened(); }
  };
  const seekPlay = (i, only) => {
    if (!ready) { pendingPlay = [i, only]; return; }
    stopSpeech();
    stopAt = only ? lineEnd(i) : (v.end ?? null);
    yp.seekTo(Math.max(0, v.t[i] - 0.15), true); yp.playVideo(); show(i, true);
  };
  loadYT().then(YT => {
    if (dead || !player.isConnected) return;
    yp = new YT.Player($("#yt", player), {
      videoId: v.yt, width: "100%", height: "100%",
      playerVars: { start: Math.floor(v.start ?? v.t[0] ?? 0), end: v.end ? Math.ceil(v.end) : undefined, rel: 0, playsinline: 1, modestbranding: 1, cc_load_policy: 0, iv_load_policy: 3, hl: ui() },
      events: {
        onReady: () => { ready = true; msg.hidden = true; try { yp.setPlaybackRate(rate); } catch (e) {} if (pendingPlay) { const [i, o] = pendingPlay; pendingPlay = null; seekPlay(i, o); } },
        onStateChange: e => { if (e.data === 1) { setPlaying(true); lastInput = Date.now(); } else if (e.data === 2 || e.data === 0) { setPlaying(false); if (e.data === 0) listened(); } },
        onError: e => fail(e.data)
      }
    });
    timer = setInterval(tick, 200);
  }).catch(() => { if (!dead) fail("blocked"); });
  return {
    play: i => seekPlay(i, false),
    pause: () => { stopAt = null; if (ready) yp.pauseVideo(); setPlaying(false); },
    repeat: i => seekPlay(i, true),
    cue: i => { if (ready) yp.seekTo(Math.max(0, v.t[i] - 0.15), true); },
    setRate: r => { if (ready) try { yp.setPlaybackRate(r); } catch (e) {} },
    destroy: () => { dead = true; clearInterval(timer); try { yp && yp.destroy(); } catch (e) {} }
  };
}

/* Dictation check: case and punctuation do not count; a few letter slips across the sentence still pass, marked as typos. */
function dictNorm(w) { return w.toLowerCase().replace(/[.,!?;:„“"«»()…–-]/g, "").replace(/ß/g, "ss").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue"); }
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
function dictCompare(target, typed) {
  const T = target.split(/\s+/).filter(Boolean), U = typed.trim().split(/\s+/).filter(Boolean);
  let dist = 0, html = "";
  T.forEach((w, i) => {
    const u = U[i] || "", a = dictNorm(w), b = dictNorm(u), d = lev(a, b);
    dist += d;
    html += (i ? " " : "") + (d === 0 ? `<span class="dok">${esc(u || w)}</span>` : d <= 1 && a.length > 3 ? `<span class="dnear" title="${esc(w)}">${esc(u)}</span>` : `<span class="dbad">${esc(u || "—")}</span><sup>${esc(w)}</sup>`);
  });
  const total = dictNorm(T.join(""));
  const ok = U.length === T.length && dist <= Math.max(1, Math.floor(total.length / 25));
  return { ok, typos: dist > 0, html };
}

const TYPE_KEY = { n: "wt_n", v: "wt_v", a: "wt_a", d: "wt_d", i: "wt_i", p: "wt_p", f: "wt_f" };
const PARTICLES = new Set("ab an auf aus bei ein fest fort her hin los mit nach vor weg weiter zu zurück zusammen um durch über unter raus rein runter rüber dazu frei krank statt teil vorbei wieder heim entgegen".split(" "));
const recSrc = path => "https://upload.wikimedia.org/wikipedia/commons/transcoded/" + path.split("/").map(encodeURIComponent).join("/") + "/" + encodeURIComponent(path.split("/").pop()) + ".mp3";
const recPage = path => "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(path.split("/").pop());
let wordAudio = null;
/* A real recording (Wiktionary speakers on Wikimedia Commons) when the glossary has one; otherwise the device's German voice. */
function playWord(text, rec, rate) {
  stopSpeech();
  if (wordAudio) { try { wordAudio.pause(); } catch (e) {} wordAudio = null; }
  if (!rec) return speak(text, { rate: rate || S.profile.rate });
  return new Promise(res => {
    let done = false; const fin = r => { if (!done) { done = true; res(r); } };
    const fallback = () => { if (done) return; wordAudio = null; speak(text, { rate: rate || S.profile.rate }).then(() => fin(false)); };
    const a = new Audio(recSrc(rec)); wordAudio = a;
    if (rate && rate < 1) { a.playbackRate = Math.max(0.6, rate); a.preservesPitch = true; }
    a.onended = () => fin(true); a.onerror = fallback;
    const guard = setTimeout(() => { if (a.readyState < 2) { try { a.pause(); } catch (e) {} fallback(); } }, 6000);
    a.onplaying = () => clearTimeout(guard);
    a.play().catch(fallback);

}
function glossView(k) {
  const e = GL.L[k], p = e[0], lemma = k.replace(/^§/, "");
  let head = lemma, gram = "";
  if (p === "n") {
    const [art, pl] = (e[1] || "").split(";");
    if (art && !/Pl\./.test(art)) head = art + " " + lemma;
    if (/Pl\./.test(art || "")) gram = t("wc_plonly");
    else if (pl) gram = t("wc_plural") + " " + pl;
  } else if (p === "v" && e[1]) gram = "Perfekt: " + e[1];
  return { k, p, lemma, head, gram, ar: e[2], rec: e[3] || "" };
}
function sepVerb(toks, idx, lemma) {
  for (let j = idx + 1; j < toks.length; j++) {
    const raw = toks[j], c = cleanWord(raw).toLowerCase();
    const end = /[.,!?;:…–]["“”»]?$/.test(raw) || j === toks.length - 1;
    if (end && PARTICLES.has(c) && GL.L[c + lemma] && GL.L[c + lemma][0] === "v") return c + lemma;
    if (end) break;
  }

}

/* Long-press (about half a second) on any word. Moving the finger cancels it, so scrolling and tapping a line work as before. */
(function longPress() {

  const cancel = () => { clearTimeout(tm); tm = null; if (target) target.classList.remove("pressing"); target = null; };
  document.addEventListener("pointerdown", e => {
    if (e.button > 0 || !e.target.closest) return;

    cancel(); target = w; sx = e.clientX; sy = e.clientY; w.classList.add("pressing");

let actx = null;
/* Short tones made in the browser (no sound files): a rising chime for right, a soft low double tone for wrong. */
function tone(ok) {
  if (S.profile.sfx === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const now = actx.currentTime;
    const notes = ok ? [[659.3, 0, .16], [880, .1, .16], [1318.5, .2, .28]] : [[233, 0, .2], [185, .17, .32]];
    notes.forEach(([f, at, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? "sine" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + at);
      g.gain.exponentialRampToValueAtTime(ok ? 0.22 : 0.3, now + at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, now + at + len);
      o.connect(g).connect(actx.destination); o.start(now + at); o.stop(now + at + len + 0.05);
    });
  } catch (e) {}
}

const PLACE = window.DF_PLACEMENT || [];

function placementCard() {

    <a class="btn sm ${pl ? "ghost" : "primary"}" href="#placement">${esc(pl ? t("pl_again") : t("pl_start"))}</a></div></section>`;

function placementResult(right, byLv) {
  const c1n = PLACE.filter(q => q.lv === "C1").length;
  if (right >= PLACE.length - 3 && byLv.C1 >= c1n - 2) return "C1";
  if (right >= Math.ceil(PLACE.length / 2)) return "B2";
  return "B2s";
}
const PL_SKILLS = ["listen", "situation", "meaning", "read"];
function viewPlacement(v) {

    const lv = placementResult(st.right, st.byLv);
    if (!st.saved) { st.saved = true; S.profile.placement = { score: st.right, lv, at: Date.now() }; save("profile"); }
    const go = lv === "C1" ? "#health" : lv === "B2" ? "#lessons" : "#lesson-" + (LESSONS[0] && LESSONS[0].id);
    const skills = PL_SKILLS.map(k => { const n = PLACE.filter(q => q.k === k).length; return `<li><span>${esc(t("pl_k_" + k))}</span><span class="kb"><i style="width:${Math.round((st.bySk[k] || 0) / n * 100)}%"></i></span><small class="muted">${st.bySk[k] || 0}/${n}</small></li>`; }).join("");

    return;
  }
  const q = PLACE[st.i];
  const opts = shuffle(q.o.map((o, i) => ({ o, i })));
  const oAttr = q.oLang === "ar" ? 'lang="ar" dir="rtl"' : 'lang="de" dir="ltr"';
  v.innerHTML = `<header class="phead">${backBtn("profile")}<h1 class="h1">${esc(t("pl_title"))}</h1><p class="muted">${esc(t("pl_sub", PLACE.length))}</p></header>

    ${q.audio ? `<div class="row wrap"><button class="btn primary" id="plPlay">${IC.speak}<span>${esc(t("listen"))}</span></button><button class="btn sm" id="plSlow">${IC.speak}<span>${esc(t("slow"))}</span></button></div><p class="muted small">${esc(t("pl_listen_hint"))}</p>` : ""}
    ${q.text ? `<blockquote class="pltext" lang="de" dir="ltr">${esc(q.text)}</blockquote>` : ""}
    <p class="qtext" ${ui() === "de" ? 'lang="de" dir="ltr"' : 'lang="ar" dir="rtl" style="text-align:right"'}>${esc(tl(q.p))}</p>
    <div class="opts">${opts.map(x => `<button class="opt" data-i="${x.i}" ${oAttr}>${esc(x.o)}</button>`).join("")}</div>
    <div id="fb" class="fb" hidden></div><div class="row-end" id="qnav"></div></section>`;

  });
}

const LNOTE = () => window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
async function applyReminder() {
  const N = LNOTE(); if (!N) return false;
  const r = S.profile.remind || { on: false, h: 19, m: 0 };
  try {
    await N.cancel({ notifications: [{ id: 7001 }] }).catch(() => {});
    if (!r.on) return true;
    const perm = await N.requestPermissions();
    if (perm && perm.display && perm.display !== "granted") { toast(t("rm_denied"), 5000); return false; }
    await N.schedule({ notifications: [{ id: 7001, title: "DeutschFlow", body: t("rm_body"), schedule: { on: { hour: r.h, minute: r.m }, repeats: true } }] });

  } catch (e) { toast(t("rm_fail"), 4000); return false; }
}

  if (!wasOpen && !(history.state && history.state.sheet)) { try { history.pushState({ dfi: navIdx + 1, sheet: 1 }, "", location.href); navIdx++; } catch (e) {} }
  $("#sheetX").onclick = () => dismissSheet();
  return sh;
}
function closeSheet(silent) { if (recStop) recStop(); if (!silent) stopSpeech(); $$("#sheet iframe").forEach(f => f.replaceWith(document.createElement("div"))); $("#sheet").hidden = true; $("#scrim").hidden = true; }
// Closing by the user (X, Escape, tapping outside): step back over the sheet's history entry; popstate then closes it.
function dismissSheet() { if (history.state && history.state.sheet) history.back(); else closeSheet(); }

  const cloud = inClaude && await connectCloud();
  if (!cloud) {
    const session = !inClaude && supaClient() ? await supaSession() : null;
    if (session && !recovering) Object.assign(backend, { mode: "supa", uid: session.user.id, email: session.user.email });
    else if (!inClaude && supaClient()) await showAuth();
    else await showGate();
  }
  try { await loadAll(); }
  catch (e) { toast(t("sync_error"), 5000); }
  rebuildLessons();
  if (backend.mode === "supa" && recovering) { await showAuth(); }
  applyChrome();
  if (!S.profile.onboarded) await showOnboarding();
  applyChrome();
  render();
  try { const d = sessionStorage.getItem("df_deleted"); if (d) { sessionStorage.removeItem("df_deleted"); toast(t(d === "full" ? "del_done_full" : "del_done_data"), 7000); } } catch (e) {}
  if (S.profile.remind && S.profile.remind.on) applyReminder();
  // Offline cache for the web page and the Android app (which loads the same page).
  if (!inClaude && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
})();

</script>
