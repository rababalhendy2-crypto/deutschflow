/* ----- daily reminder (Android app only) ----- */
const LNOTE = () => window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
async function applyReminder() {
  const N = LNOTE(); if (!N) return false;
  const r = S.profile.remind || { on: false, h: 19, m: 0 };
  try {
    await N.cancel({ notifications: [{ id: 7001 }] }).catch(() => {});
    if (!r.on) return true;
    const perm = await N.requestPermissions();
    if (perm && perm.display && perm.display !== "granted") { toast(t("rm_denied"), 5000); return false; }
    await N.schedule({ notifications: [{ id: 7001, title: "DeutschFlow", body: t("rm_body"), schedule: { on: { hour: r.h, minute: r.m }, repeats: true } }] });
    return true;
  } catch (e) { toast(t("rm_fail"), 4000); return false; }
}

/* ----- delete account ----- */
async function deleteEverything() {
  if (backend.mode === "supa") {
    // The server function deletes the login and every saved row; only the signed-in user can delete themself.
    let full = false;
    try { const r = await sb.functions.invoke("delete-account", { method: "POST" }); full = !r.error && !!(r.data && r.data.deleted); } catch (e) {}
    if (!full) {
      // Server unreachable: still remove the data rows the user may delete under row level security.
      const { error } = await sb.from("user_docs").delete().eq("user_id", backend.uid);
      if (error) throw error;
    }
    try { await sb.auth.signOut({ scope: full ? "local" : "global" }); } catch (e) {}
    return full;
  }
  if (backend.mode === "local") DOCS.forEach(n => { try { localStorage.removeItem(LOCAL_KEY + n); } catch (e) {} });
  return true;
}

    <label>${esc(t("theme"))}${sel("sTheme", P.theme, [["system", t("th_system")], ["light", t("th_light")], ["dark", t("th_dark")]])}</label>
    <div class="lookpick"><span>${esc(t("colors"))}</span><div class="swatches" role="radiogroup">${Object.entries(PALETTES).map(([k, p]) => `<button type="button" role="radio" aria-checked="${(P.palette || "lagoon") === k}" class="swatch ${(P.palette || "lagoon") === k ? "on" : ""}" data-pal="${k}" style="--s1:${p[2][6]};--s2:${p[2][8]};--s3:${p[2][10]}"><i></i><span>${esc(ui() === "de" ? p[1] : p[0])}</span></button>`).join("")}</div></div>
    <label>${esc(t("font"))}${sel("sFont", P.font || "rubik", Object.entries(FONTS).map(([k, f]) => [k, f[0]]))}</label>
    <p class="fontsample" dir="auto">${esc(t("font_sample"))}</p>
    <label class="row"><input type="checkbox" id="sWCol" ${P.wordColors !== false ? "checked" : ""}> ${esc(t("word_colors"))}</label>
    <label>${esc(t("def_speed"))}${sel("sRate", P.rate, [[0.6, "0.6×"], [0.8, "0.8×"], [1, "1×"], [1.2, "1.2×"]])}</label>
  </section>

    <label>${esc(t("rm_time"))}${sel("sRemAt", (P.remind ? P.remind.h : 19), [7, 8, 9, 12, 13, 17, 18, 19, 20, 21, 22].map(h => [h, String(h).padStart(2, "0") + ":00"]))}</label></section>` : ""}
  ${placementCard()}

  <section class="block"><button class="btn danger" id="sReset">${esc(resetArmed ? t("reset_confirm") : t("reset_all"))}</button></section>

  const bind = (id, key, num, after) => { $(id, v).onchange = e => { P[key] = num ? +e.target.value : e.target.value; save("profile"); if (after) after(); }; };

  if ($("#mfaBox", v)) renderMfa($("#mfaBox", v));

/* ================= sheet ================= */
function openSheet(html) {
  const sh = $("#sheet");
  sh.innerHTML = `<div class="grab"></div><button class="iconbtn sheet-x" id="sheetX" aria-label="close">${IC.close}</button>${html}`;
  sh.dir = ui() === "de" ? "ltr" : "rtl";
  const wasOpen = !sh.hidden;
  sh.hidden = false; $("#scrim").hidden = false; sh.scrollTop = 0;
  // Give the sheet its own history entry so Back closes it rather than leaving the screen.
  if (!wasOpen && !(history.state && history.state.sheet)) { try { history.pushState({ dfi: navIdx + 1, sheet: 1 }, "", location.href); navIdx++; } catch (e) {} }
  $("#sheetX").onclick = () => dismissSheet();
  return sh;
}
function closeSheet(silent) { if (recStop) recStop(); if (!silent) stopSpeech(); $$("#sheet iframe").forEach(f => f.replaceWith(document.createElement("div"))); $("#sheet").hidden = true; $("#scrim").hidden = true; }
// Closing by the user (X, Escape, tapping outside): step back over the sheet's history entry; popstate then closes it.
function dismissSheet() { if (history.state && history.state.sheet) history.back(); else closeSheet(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) dismissSheet(); });
$("#scrim").addEventListener("click", () => { if (!$("#sheet").hidden) dismissSheet(); });

  return new Promise(res => {
    $("#view").innerHTML = `<section class="gate card"><span class="lvl" lang="de">B2</span><h1 class="h1">${esc(t("gate_title"))}</h1><p>${esc(t("gate_body"))}</p>
      <button class="btn ghost" id="gLocal">${esc(t("gate_local"))}</button></section>`;
    $("#gLocal").onclick = () => { backend.mode = "local"; res(); };
  });
}
function showOnboarding() {
  return new Promise(res => {
    const P = S.profile;
    const draw = () => {
      applyChrome();
      const opt = (name, val, lab) => `<label class="pick"><input type="radio" name="${name}" value="${val}" ${P[name] === val ? "checked" : ""}><span>${esc(lab)}</span></label>`;
      $("#view").innerHTML = `<section class="onb card"><span class="lvl" lang="de">B2 → C1</span><h1 class="h1">${esc(t("onb_title"))}</h1><p class="muted">${esc(t("onb_sub"))}</p>
        <fieldset><legend>${esc(t("ui_lang"))}</legend>${opt("uiLang", "ar", "العربية")}${opt("uiLang", "de", "Deutsch")}</fieldset>
        <fieldset><legend>${esc(t("expl_lang"))}</legend>${opt("explLang", "ar", t("lang_ar"))}${opt("explLang", "de", t("lang_de"))}</fieldset>
        <fieldset><legend>${esc(t("goal"))}</legend>${opt("goal", "daily", t("g_daily"))}${opt("goal", "work", t("g_work"))}${opt("goal", "exam", t("g_exam"))}</fieldset>
        <button class="btn primary big" id="oGo">${esc(t("start"))}</button></section>`;
      $$("input[type=radio]").forEach(r => r.onchange = () => { P[r.name] = r.value; if (r.name === "uiLang") draw(); });
      $("#oGo").onclick = () => { P.onboarded = true; save("profile"); res(); };
    };
    draw();
  });
}

/* ================= boot ================= */
async function boot() {
  applyChrome();
  $("#view").innerHTML = `<div class="splash"><span class="lvl" lang="de">DeutschFlow</span><p class="muted">${esc(t("loading"))}</p></div>`;
  const inClaude = !!(window.claude && typeof window.claude.use === "function");
  const cloud = inClaude && await connectCloud();
  if (!cloud) {
    let session = !inClaude && supaClient() ? await supaSession() : null, note = "";
    if (session && !recovering && idleTooLong()) { try { await sb.auth.signOut({ scope: "local" }); } catch (e) {} session = null; note = t("idle_out"); }
    if (session && !recovering && await mfaNeeded(sb) && !(await showMfaChallenge(sb))) session = null;
    if (session && !recovering) { touchActive(); Object.assign(backend, { mode: "supa", uid: session.user.id, email: session.user.email }); }
    else if (!inClaude && supaClient()) await showAuth(note);
    else await showGate();
  }
  try { await loadAll(); }
  catch (e) { toast(t("sync_error"), 5000); }
  rebuildLessons();
  if (backend.mode === "supa" && recovering) { await showAuth(); }
  applyChrome();
  if (!S.profile.onboarded) await showOnboarding();
  applyChrome();
  render();
  try { const d = sessionStorage.getItem("df_deleted"); if (d) { sessionStorage.removeItem("df_deleted"); toast(t(d === "full" ? "del_done_full" : "del_done_data"), 7000); } } catch (e) {}
  if (S.profile.remind && S.profile.remind.on) applyReminder();
  if (backend.mode === "supa") { touchActive(); document.addEventListener("visibilitychange", () => { if (!document.hidden) touchActive(); }); }
  // Offline cache for the web page and the Android app (which loads the same page).
  if (!inClaude && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
})();
