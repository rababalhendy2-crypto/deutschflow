<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C6670"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script src="supabase.js"></script><title>DeutschFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one readable column (max 760px) with a sticky top bar and a bottom tab bar, like a native app.
   Warm cream and plum ink, tangerine for actions, violet and sunflower for highlights; German text in a grotesk, Arabic in Plex Arabic. */
:root{
  --bg:#FFF6EC; --surface:#FFFFFF; --surface2:#FFEAD5; --line:#F0D8C2; --fg:#24143A; --muted:#6E5A70;
  --primary:#F2542D; --primary-fg:#FFFFFF; --accent:#7B3FE4; --accent-soft:#EEE3FF;
  --ok:#1C7F4E; --ok-soft:#DDF2E6; --bad:#C0331B; --bad-soft:#FDE1D9; --warn:#9A6A10; --hl:#FFD23F;
  --shadow:0 1px 2px rgba(36,20,58,.06),0 8px 24px rgba(242,84,45,.10);
  --f-de:"Bricolage Grotesque","IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#160E22; --surface:#21152F; --surface2:#2C1D3E; --line:#3A2950; --fg:#F7EEFF; --muted:#B9A6C9;
  --primary:#FF7A55; --primary-fg:#1A0E05; --accent:#B58CFF; --accent-soft:#2F2148;
  --ok:#53D18B; --ok-soft:#123222; --bad:#FF8D63; --bad-soft:#3A1E14; --warn:#E3B04B; --hl:#FFC233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#160E22; --surface:#21152F; --surface2:#2C1D3E; --line:#3A2950; --fg:#F7EEFF; --muted:#B9A6C9;
  --primary:#FF7A55; --primary-fg:#1A0E05; --accent:#B58CFF; --accent-soft:#2F2148;
  --ok:#53D18B; --ok-soft:#123222; --bad:#FF8D63; --bad-soft:#3A1E14; --warn:#E3B04B; --hl:#FFC233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
/* the app's own theme choice wins over the viewer's */
:root[data-df-theme="light"]{
  --bg:#FFF6EC; --surface:#FFFFFF; --surface2:#FFEAD5; --line:#F0D8C2; --fg:#24143A; --muted:#6E5A70;
  --primary:#F2542D; --primary-fg:#FFFFFF; --accent:#7B3FE4; --accent-soft:#EEE3FF;
  --ok:#1C7F4E; --ok-soft:#DDF2E6; --bad:#C0331B; --bad-soft:#FDE1D9; --warn:#9A6A10; --hl:#FFD23F;
  --shadow:0 1px 2px rgba(36,20,58,.06),0 8px 24px rgba(242,84,45,.10); color-scheme:light}
:root[data-df-theme="dark"]{
  --bg:#160E22; --surface:#21152F; --surface2:#2C1D3E; --line:#3A2950; --fg:#F7EEFF; --muted:#B9A6C9;
  --primary:#FF7A55; --primary-fg:#1A0E05; --accent:#B58CFF; --accent-soft:#2F2148;
  --ok:#53D18B; --ok-soft:#123222; --bad:#FF8D63; --bad-soft:#3A1E14; --warn:#E3B04B; --hl:#FFC233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.6}
.app[dir="rtl"]{font-family:var(--f-ar)}
[lang="de"]{font-family:var(--f-de)}
[lang="ar"]{font-family:var(--f-ar)}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{width:20px;height:20px;flex:none}
.visually-hidden,.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.app{max-width:760px;margin:0 auto;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-de);font-weight:800;font-size:20px;letter-spacing:-.02em;direction:ltr}
.brand i{font-style:normal;color:var(--accent)}
.sync{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.sync span:not(.dot){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync.busy .dot{background:var(--accent);animation:blink 1s infinite}
.sync.bad{color:var(--bad)} .sync.bad .dot{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
.nav{position:fixed;z-index:6;inset:auto 0 0 0;max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;color:var(--muted)}
.nav a.on{color:var(--primary);font-weight:600}
.nav a.on svg{transform:translateY(-1px)}

/* type */
.h1{font-size:clamp(22px,5.5vw,28px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.h2{font-size:16px;margin:0;font-weight:700}
.h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.h3 svg{width:16px;height:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.app[dir="rtl"] .eyebrow{letter-spacing:0}
.note{font-size:13.5px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line);border-radius:12px;margin:0}
.empty{color:var(--muted);margin:0}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.block{display:flex;flex-direction:column;gap:10px}
.center{text-align:center;align-items:center;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center} .wrap{flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.center-row{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14.5px;min-height:42px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.ghost{background:transparent}
.btn.big{padding:13px 20px;font-size:16px;min-height:50px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.sm svg{width:16px;height:16px}
.btn.done{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.85;cursor:default}
.btn.primary[disabled]{opacity:.45}
.linkbtn{color:var(--primary);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--bad)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface2);flex:none}
.app[dir="rtl"] .iconbtn svg[data-flip], .app[dir="rtl"] .lhead .iconbtn svg, .app[dir="rtl"] .phead .iconbtn svg{transform:scaleX(-1)}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.ok,.chip.st-mastered{background:var(--ok-soft);color:var(--ok)}
.chip.warn,.chip.st-learning{background:var(--accent-soft);color:var(--warn)}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track.sm{height:5px}
.track i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.app[dir="rtl"] .track{transform:scaleX(-1)}
.lvl{display:inline-block;font-family:var(--f-de);font-weight:800;font-size:13px;padding:3px 10px;border-radius:8px;background:var(--fg);color:var(--bg);letter-spacing:.02em}

/* home */
.hero{background:linear-gradient(150deg,#F2542D 0%,#C2338A 55%,#5B2BC4 100%);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.hero .eyebrow{color:#FFE7A3}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.hero .lvl{background:#FFD23F;color:#24143A}
.hero-title{font-size:clamp(24px,6.5vw,34px);margin:2px 0 0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.hero-sub{margin:0;opacity:.88;font-size:14px}
.hero .btn.primary{background:#FFD23F;color:#24143A;border-color:#FFD23F;align-self:flex-start}
.goalbar{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.goalbar .gl{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.goalbar .track{background:rgba(255,255,255,.18)} .goalbar .track i{background:#FFD37A}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-de);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile b small{font-size:14px;color:var(--muted);font-weight:600}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.hot{border-color:var(--accent);background:var(--accent-soft)}
.tile .track{margin-top:6px}
.chart{display:flex;flex-direction:column;gap:4px}
.chart .plot{position:relative;height:var(--h);display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;height:100%;display:flex;align-items:flex-end}
.chart .col i{display:block;width:100%;background:color-mix(in srgb,var(--primary) 55%,var(--surface2));border-radius:4px 4px 1px 1px;transition:height .4s}
.chart .col.today i{background:var(--accent)}
.chart .goal{position:absolute;inset-inline:0;border-top:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);pointer-events:none}
.chart .goal em{position:absolute;top:-17px;right:0;font-style:normal;font-size:10.5px;color:var(--muted);background:var(--surface);padding:0 4px}
.chart .xax{display:flex;gap:4px;font-size:11px;color:var(--muted)}
.chart .xax span{flex:1;text-align:center;min-width:0;overflow:hidden}

/* lessons */
.phead{display:flex;flex-direction:column;gap:8px}
.phead:has(.iconbtn){flex-direction:row;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap;font-weight:600;color:var(--muted)}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lcard{position:relative;display:flex;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--primary)}
.lcard:active{transform:scale(.99)}
.lnum{font-family:var(--f-de);font-weight:800;font-size:22px;color:var(--primary);line-height:1;min-width:30px;padding-top:2px}
.lbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.ltopic{font-size:12px;color:var(--muted)}
.ltitle{font-weight:700;font-size:16.5px;line-height:1.3;text-align:start}
.lmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:2px}
.lbar{position:absolute;inset:auto 0 0 0;height:3px;background:var(--surface2)}
.lbar i{display:block;height:100%;background:var(--ok)}

/* lesson */
.lhead{display:flex;gap:12px;align-items:flex-start}
.lhead-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lhead .h1{text-align:start}
.lsum{margin:-6px 0 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);padding:4px;border-radius:14px;gap:4px}
.tab{padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
#lbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.player{background:#0F1E23;color:#EEF4F5;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;
  background-image:radial-gradient(120% 80% at 100% 0%,rgba(77,184,192,.28),transparent 60%),radial-gradient(80% 60% at 0% 100%,rgba(235,180,70,.18),transparent 70%)}
.cast{display:flex;gap:8px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px;transition:background .2s}
[dir="rtl"] .who{padding:3px 3px 3px 10px}
.who i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-style:normal;font-weight:800;font-size:12px}
.who.talk{background:#EBB446;color:#241800}
.stage{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center;cursor:pointer;padding:6px 4px}
.spk{font-size:12px;color:#EBB446;font-weight:600}
.de-line{font-size:clamp(20px,5.4vw,26px);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.ar-line{margin:0;font-size:16px;color:rgba(238,244,245,.82);text-wrap:balance}
.de-hidden{display:none;margin:0;font-size:15px;color:rgba(238,244,245,.7);border:1px dashed rgba(255,255,255,.25);border-radius:12px;padding:16px}
.player.hide-de .de-line{display:none} .player.hide-de .de-hidden{display:block}
.player.hide-ar .ar-line{display:none}
.w{border-radius:4px;transition:color .12s,background .12s}
.w.on{color:#EBB446}
.dots{display:flex;gap:4px}
.dot{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.dot.done{background:rgba(255,255,255,.6)} .dot.now{background:#EBB446}
.pctl{display:flex;align-items:center;justify-content:center;gap:10px}
.pctl .iconbtn{background:rgba(255,255,255,.1);color:#EEF4F5}
.playbtn{width:60px;height:60px;border-radius:50%;background:#EEF4F5;color:#0F1E23;display:grid;place-items:center}
.playbtn svg{width:26px;height:26px}
.speed select{background:rgba(255,255,255,.1);color:#EEF4F5;border:0;border-radius:10px;padding:9px 8px;font-family:var(--f-de);font-weight:700}
.speed option{color:#111}
.toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);cursor:pointer}
.tgl input{accent-color:#EBB446;width:16px;height:16px;margin:0}
.demo{margin:0;font-size:11.5px;color:rgba(238,244,245,.6);text-align:center}
.hint{margin:0;font-size:13px}
.transcript{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tline{display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s}
.tline.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] .tline.now{box-shadow:inset -3px 0 0 var(--accent)}
.tspk{font-size:11.5px;color:var(--primary);font-weight:600}
.tde{font-size:16px;font-weight:600;line-height:1.4;text-align:left}
.tar{font-size:14px;color:var(--muted);text-align:right}
.transcript.hide-de .tde{filter:blur(6px);user-select:none}
.transcript.hide-ar .tar{display:none}
.lnav{display:flex;justify-content:space-between;gap:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,14,.5);z-index:20}
.sheet{position:fixed;z-index:21;inset:auto 0 0 0;max-width:760px;margin:0 auto;max-height:88%;overflow-y:auto;background:var(--surface);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-x{position:absolute;top:12px;inset-inline-end:14px}
.sheet p{margin:0 0 6px}
.big-de{font-size:clamp(21px,5.6vw,26px);font-weight:600;line-height:1.35;margin:8px 0 4px!important;text-align:left;padding-inline-end:40px}
.big-ar{font-size:17px;color:var(--muted);text-align:right}
.reg{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.reg-f{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.reg-n{background:var(--surface2);color:var(--muted)}
.reg-i{background:var(--accent-soft);color:var(--warn)}
.vlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surface2)}
.vlist li>span{display:flex;flex-direction:column;min-width:0}
.vlist small{color:var(--muted);font-size:13px}
.exbox{padding:12px 14px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.exbox p[lang="de"]{font-weight:600}
.rec{margin-top:10px;padding-top:4px;border-top:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.cmp>div{padding:12px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp-de{font-weight:600}
audio{width:100%}

/* exercises */
.excard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
#qbody{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#qbody>.btn{align-self:flex-start}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:0;text-align:left}
.gap{display:inline-block;min-width:3em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}

      [["am Anschlag sein", "في أقصى طاقته"], ["sowieso", "أصلاً"]], ["Seit dem Umzug bin ich total am Anschlag.", "منذ الانتقال وأنا في أقصى طاقتي."]],
    [96.7, "A", "Äußerlich läuft das alles gut, LKA Hamburg, toll, ja, aber eigentlich hast du immer noch Angst und musst jeden Tag dagegen an.", "من الخارج كل شيء يسير جيداً، مكتب التحقيقات في هامبورغ، رائع، لكن في الحقيقة ما زلت خائفاً ويجب أن تقاوم ذلك كل يوم.", "n",
      "التباين «äußerlich … aber eigentlich» مفيد لشرح الفرق بين المظهر والحقيقة. «gegen etwas ankommen/an müssen» = يقاوم.", "Kontrast «äußerlich … aber eigentlich»; «gegen etwas an müssen» = dagegen kämpfen.",
      [["äußerlich", "من الخارج / ظاهرياً"], ["eigentlich", "في الحقيقة"]], ["Äußerlich wirkt sie ruhig, aber eigentlich ist sie nervös.", "تبدو هادئة من الخارج لكنها في الحقيقة متوترة."]],
    [101.7, "A", "Und jetzt also auch noch das Kind, das schreit sich die Seele aus dem Leib, und du kriegst das nicht mal richtig gehalten.", "والآن فوق ذلك الطفل، يصرخ بكل قوته، وأنت لا تستطيع حتى أن تحمله كما يجب.", "i",
      "«sich die Seele aus dem Leib schreien» = يصرخ بأعلى صوته. «auch noch» = فوق كل ذلك.", "«sich die Seele aus dem Leib schreien» = extrem laut schreien.",
      [["sich die Seele aus dem Leib schreien", "يصرخ بأعلى صوته"], ["auch noch", "وفوق ذلك"]], null],
    [107.1, "A", "Denkst dir: Wie soll ich das denn alles schaffen? Ich schaff das alles gar nicht. Gar nichts schaff ich mehr.", "وتقول لنفسك: كيف سأنجز كل هذا؟ لا أستطيع إنجاز أي شيء. لم أعد أنجز شيئاً.", "n",
      "«etwas schaffen» = ينجز / يقدر على. من أهم الأفعال في الحياة اليومية والعمل.", "«schaffen» = bewältigen; sehr häufig.",
      [["etwas schaffen", "ينجز / يقدر على"]], ["Schaffst du das bis Freitag?", "هل تستطيع إنجاز ذلك حتى الجمعة؟"]],
    [111.1, "A", "Das Schlimmste ist immer der nächste Tag. Ja, dann wirst du krank, kriegst keine Luft mehr.", "أسوأ شيء دائماً هو اليوم التالي. ثم تمرض، ولا تستطيع التنفس.", "n",
      "«Das Schlimmste ist …» تركيب مفيد للتأكيد. «keine Luft kriegen» = لا يستطيع التنفس.", "«Das Schlimmste ist …»; «keine Luft kriegen» = nicht atmen können.",
      [["Das Schlimmste ist …", "الأسوأ هو…"], ["keine Luft kriegen", "لا يستطيع التنفس"]], null],
    [117.1, "A", "Bist erschöpft, andauernd. Immer öfter. Kommst gar nicht mehr aus dem Bett.", "مُنهَك باستمرار. أكثر فأكثر. لا تستطيع النهوض من السرير.", "n",
      "«erschöpft» = منهك. «immer öfter» = أكثر فأكثر (immer + صيغة المقارنة).", "«immer + Komparativ» = zunehmend.",
      [["erschöpft", "منهك"], ["andauernd", "باستمرار"]], ["Die Mieten werden immer teurer.", "الإيجارات تزداد غلاءً."]],
    [121.0, "A", "Und dein Körper fährt mit dir Schlitten, und du denkst: Das geht so nicht. Ich kann das so nicht.", "وجسمك يتلاعب بك، وتفكر: لا يمكن أن يستمر هذا. لا أستطيع هكذا.", "i",
      "«mit jemandem Schlitten fahren» = يتحكم به ويتلاعب به كما يشاء. «Das geht so nicht» = هذا غير مقبول هكذا.", "«mit jemandem Schlitten fahren» = jemanden rücksichtslos behandeln.",
      [["mit jemandem Schlitten fahren", "يتلاعب بأحد"], ["Das geht so nicht.", "لا يمكن الاستمرار هكذا"]], ["Das geht so nicht weiter, wir müssen reden.", "لا يمكن أن نستمر هكذا، يجب أن نتكلم."]],
    [126.1, "A", "Wirst immer kränker und denkst, da muss doch mal irgendeiner was finden.", "تمرض أكثر وأكثر وتفكر: لا بد أن يجد أحدهم شيئاً.", "n",
      "«doch mal» تعبّر عن رجاء ونفاد صبر.", "«doch mal» drückt Ungeduld und Hoffnung aus.", [], null],
    [130.0, "A", "Schleppst dich von einem Arzt zum nächsten, und ich weiß überhaupt nicht, warum ich dir das alles erzähle, wir kennen uns ja eigentlich überhaupt nicht.", "تجرّ نفسك من طبيب إلى آخر، ولا أعرف أبداً لماذا أحكي لك كل هذا، فنحن في الحقيقة لا نعرف بعضنا.", "n",
      "«sich schleppen» = يجرّ نفسه بصعوبة. لاحظ كيف ينتقل من «du» العامة إلى «ich» عندما يصبح الكلام شخصياً.", "«sich schleppen» = sich mühsam bewegen; Wechsel vom generischen «du» zu «ich».",
      [["sich schleppen", "يجرّ نفسه"], ["von einem Arzt zum nächsten", "من طبيب إلى آخر"]], null],
    [134.4, "A", "Aber niemand findet was?", "ولا أحد يجد شيئاً؟", "n", "", "", [], null],
    [135.8, "A", "Ne. Niemand findet was.", "لا. لا أحد يجد شيئاً.", "n", "", "", [], null]

  L: [
    [0.1, "A", "Ja, es tut mir leid, Ihnen das mitteilen zu müssen, aber der Dirk ist tot. Also Ihr Nachbar Dirk Lorenzen ist tot – ist ermordet.", "نعم، يؤسفني أن أبلغك بذلك، لكن ديرك مات. أعني جارك ديرك لورنتسن مات، قُتل.", "f",
      "«Es tut mir leid, Ihnen mitteilen zu müssen, dass …» عبارة رسمية لإبلاغ خبر سيئ (في الشرطة، المستشفى، الرسائل الرسمية).", "Offizielle Formel, um schlechte Nachrichten zu überbringen.",
      [["jemandem etwas mitteilen", "يُبلغ أحداً بشيء"], ["ermordet", "مقتول"]], ["Es tut mir leid, Ihnen mitteilen zu müssen, dass die Stelle schon besetzt ist.", "يؤسفني أن أبلغك أن الوظيفة شُغلت."]],
    [6.6, "A", "Das war jetzt aber so ein richtiger Klischeesatz eben. „Es tut mir leid, Ihnen das mitteilen zu müssen.“ Es tut Ihnen doch gar nicht leid.", "هذه كانت جملة مستهلكة تماماً. «يؤسفني أن أبلغك». أنت لست آسفاً أبداً.", "n",

      [["das Klischee", "الكليشيه / العبارة المستهلكة"]], null],
    [13.7, "A", "Na, es tut mir schon irgendwie leid.", "لا، أنا آسف نوعاً ما.", "n",

      [["irgendwie", "نوعاً ما"]], ["Das ist schon irgendwie komisch.", "هذا غريب نوعاً ما."]],
    [15.9, "A", "Ja, irgendwie vielleicht. Wegen der Arbeit, die Sie jetzt damit haben, aber das müssen Sie doch nicht sagen. Warum sagen Sie so was? So eine Floskel.", "ربما نوعاً ما. بسبب العمل الذي ستتحمله الآن، لكن لا داعي أن تقول ذلك. لماذا تقول شيئاً كهذا؟ عبارة فارغة.", "n",
      "«die Floskel» = عبارة جاهزة فارغة المعنى. كلمة مهمة عند الكلام عن الأسلوب.", "«Floskel» = leere Redewendung.",
      [["die Floskel", "العبارة الجاهزة الفارغة"]], ["Seine Rede bestand nur aus Floskeln.", "خطابه كان مجرد عبارات فارغة."]],
    [22.3, "A", "Der ist halt eine Brücke. Der Satz, der leitet über zu dem schlimmen Teil, weil der ohne die Brücke zu brutal wäre. Gefühllos.", "إنها جسر. الجملة تمهّد للجزء السيئ، لأنه بدون الجسر سيكون قاسياً جداً. بلا مشاعر.", "n",

      [["überleiten zu", "يمهّد لـ"], ["gefühllos", "بلا مشاعر"]], ["Mit einer kurzen Frage hat sie zum nächsten Thema übergeleitet.", "بسؤال قصير انتقلت إلى الموضوع التالي."]],
    [28.2, "A", "Ja, da kann man die doch auch weglassen, die Brücke. Man weiß sowieso schon, was kommt. Der Tod ist doch keine Insel. Da brauchst du keine Brücke. Ist Festland. Der Tod, der gehört dazu.", "إذاً يمكن الاستغناء عنها، عن الجسر. الكل يعرف ما الذي سيأتي. الموت ليس جزيرة. لا تحتاج جسراً. إنه يابسة. الموت جزء من الحياة.", "n",
      "يكمل الاستعارة بذكاء: Insel/Festland. «weglassen» = يحذف. «dazugehören» = جزء من.", "Er spielt mit der Metapher Insel/Festland; «weglassen» = auslassen.",
      [["weglassen", "يحذف / يستغني عن"], ["dazugehören", "يكون جزءاً من"]], ["Streit gehört in jeder Beziehung dazu.", "الخلاف جزء من كل علاقة."]],
    [37.4, "A", "Nee, nee, nee, stellen Sie sich mal vor, Sie klingeln bei einer Witwe, die noch gar nicht weiß, dass sie Witwe ist. Die macht die Tür auf, hat noch den Putzlappen in der Hand, und Sie sagen als Erstes: „Hallo, Ihr Mann ist tot.“ Das nennt man Empathie.", "لا، لا، لا، تخيّل أنك تدق جرس أرملة لا تعرف بعد أنها أرملة. تفتح الباب وما زالت خرقة التنظيف في يدها، وأنت تقول أولاً: «مرحباً، زوجك مات». هذا ما تسميه تعاطفاً؟", "n",
      "«Stellen Sie sich mal vor, …» = تخيّل… طريقة قوية لإقناع الآخر بمثال. الجملة الأخيرة ساخرة.", "«Stellen Sie sich vor …» = Argument mit Beispiel; der Schluss ist ironisch.",
      [["sich etwas vorstellen", "يتخيل شيئاً"], ["die Witwe", "الأرملة"], ["die Empathie", "التعاطف"]], ["Stell dir mal vor, du verlierst deinen Job.", "تخيّل أنك فقدت عملك."]],
    [48.6, "A", "Ich finde es eher interessant, dass Sie sich frische Witwen mit einem Putzlappen vorstellen. Ist das nicht unfeministisch?", "أنا أجد المثير للاهتمام أكثر أنك تتخيل الأرامل الجدد مع خرقة تنظيف. أليس هذا ضد النسوية؟", "n",

      [["eher", "بالأحرى / أكثر"], ["Ich finde es …, dass …", "أجد أن…"]], ["Ich finde es eher seltsam, dass niemand gefragt hat.", "أجد من الغريب بالأحرى أن أحداً لم يسأل."]],
    [55.5, "A", "Ja, was soll die denn sonst in der Hand halten? Eine Spielkonsole?", "طيب، وماذا ستحمل في يدها غير ذلك؟ جهاز ألعاب؟", "i",

      [["der Nachweis", "الإثبات"], ["offiziell", "رسمي"]], ["Für den Antrag brauchen Sie einen Einkommensnachweis.", "للطلب تحتاج إثبات دخل."]],

    [169.5, "Kleiner Lord, du musst gar nichts beweisen. Du bist genau …", "أيها اللورد الصغير، لست مضطراً لإثبات أي شيء. أنت بالضبط…"],
    [172.9, "Falsch, Sie müssen Ich-Botschaften formulieren, aber das lernen Sie schon noch von mir.", "خطأ، يجب أن تصوغ رسائل بصيغة «أنا»، لكنك ستتعلم ذلك مني."],
    [178.0, "Wenn ich ihm das noch unter die Nase reiben könnte: Großvater, ich habe das Schloss verkauft. Es ist jetzt eine Burnout-Klinik.", "لو أستطيع أن أفرك هذا في وجهه: يا جدّي، بعت القصر. صار الآن عيادة للاحتراق النفسي."],
    [184.2, "Ich habe lebenslanges Mietrecht und komme gratis in alle Kurse, und niemand zwingt mich mehr, Lieder über hässliche goldene Slipper zu singen. Guter Deal, oder?", "عندي حق السكن مدى الحياة وأدخل كل الدورات مجاناً، ولا أحد يجبرني بعد الآن على غناء أغانٍ عن خُفّ ذهبي قبيح. صفقة جيدة، صح؟"],
    [193.9, "Toll, ja. Da wäre noch etwas, Sir. Ich kündige.", "رائع. وهناك شيء آخر يا سيدي: أنا أستقيل."],
    [199.4, "Bitte?", "عفواً؟"],
    [200.0, "Nun ja, Sie bestehen ja darauf, dass ich die Feiertage durcharbeite, und ich würde so gerne mal wieder Weihnachten mit Mutti feiern. Sie ist so traurig …", "حسناً، أنت تصرّ أن أعمل في كل الأعياد، وأنا أودّ كثيراً أن أحتفل بالميلاد مع أمي من جديد. إنها حزينة جداً…"],
    [206.4, "Und mein Weihnachten?", "وميلادي أنا؟"],
    [207.8, "Nun ja, Sie könnten sich ja Freunde suchen, mit denen Sie Weihnachten feiern. Oder mit Ihrem inneren Kind.", "حسناً، يمكنك أن تبحث عن أصدقاء تحتفل معهم بالميلاد. أو مع طفلك الداخلي."],
    [214.8, "Mein inneres Kind feiert hier gar nichts mehr! Ist doch alles Kacke hier! Alex, starte Sissi.", "طفلي الداخلي لن يحتفل بشيء هنا بعد الآن! كل شيء هنا سيئ! أليكس، شغّل «سيسي»."]
  ])
},
{
  id: "s-kurzschluss-silvester", yt: "UniPvTMWykE", start: 1.5, end: 128, src: ["ARD", "Kurzschluss hoch drei"], title: "Silvester im Aufzug",
  keys: [["feststecken", "يعلق"], ["Apropos …", "بالحديث عن…"], ["Hinterher ist man immer schlauer.", "بعد فوات الأوان يصبح الإنسان أذكى"], ["Ist das dein Ernst?", "هل أنت جاد؟"]],
  lines: [
    [2.1, "Die Karte steckt fest.", "البطاقة عالقة."],
    [4.9, "Die Tür auch.", "والباب أيضاً."],
    [6.0, "Echt jetzt?", "بجد؟"],
    [6.7, "Ich muss hier raus. Ich muss zu meiner Tochter.", "يجب أن أخرج من هنا. يجب أن أذهب إلى ابنتي."],
    [8.1, "Hallo? Ist da jemand?", "ألو؟ هل هناك أحد؟"],
    [9.3, "Drei!", "ثلاثة!"],
    [10.3, "Geh weg da! Scheißdreck!", "ابتعد من هناك! يا للقرف!"],
    [14.2, "Ein Mitschüler von mir wollte mal mit einem Böller den Mülleimer an der Bushaltestelle sprengen. Von da an hieß er bei uns nur noch Doofmann.", "زميل لي في المدرسة أراد مرة أن يفجّر سلة القمامة عند موقف الباص بمفرقعة. ومن يومها صرنا نسميه «دوفمان» (الأحمق)."],
    [21.1, "Martin Hofmann. – Ja.", "مارتن هوفمان. – نعم."],
    [24.8, "Nein? Oh.", "لا؟ أوه."],
    [25.9, "Apropos Schicksal: Alte Tradition von mir – an Silvester verteile ich Glückskekse.", "بالحديث عن القدر: عادة قديمة عندي، في ليلة رأس السنة أوزّع كعك الحظ."],
    [31.3, "„Wenn sich eine Tür schließt, öffnet sich eine neue.“", "«عندما يُغلق باب، يُفتح باب جديد.»"],
    [38.4, "Nicht erschrecken! Sorry.", "لا تفزعي! آسف."],
    [40.9, "Martin … – Wer ist er denn?", "مارتن… – من هذا؟"],
    [42.9, "Was machst du hier?", "ماذا تفعل هنا؟"],
    [44.0, "Ich habe gedacht, vielleicht treffe ich dich hier. Also ehrlich gesagt habe ich das sogar gehofft.", "فكرت أنني ربما ألتقيك هنا. وبصراحة، كنت أتمنى ذلك."],
    [47.5, "Ich gehe jetzt zu Peter und sage ihm, dass er der blöden Kuh und ihrem Heini nichts ausschenken soll.", "سأذهب الآن إلى بيتر وأقول له ألا يقدّم شيئاً لتلك الغبية وصاحبها."],
    [51.9, "Hat er dich gerade blöde Kuh genannt?", "هل سمّاك للتو «بقرة غبية»؟"],
    [53.4, "Oh Shit! – Olli!", "يا للمصيبة! – أولي!"],
    [54.8, "Wir müssen hier weg. – Der war voll aggressiv.", "يجب أن نخرج من هنا. – كان عدوانياً جداً."],
    [57.8, "Machen Sie die Tür auf, Bettina. Wir brauchen unser Feuerwerk.", "افتحي الباب يا بيتينا. نحتاج ألعابنا النارية."],
    [61.2, "Das ist das Feuerwerk von diesem Jahr?", "هذه ألعاب هذه السنة النارية؟"],
    [63.2, "Die Tür, Bettina. – Wird es bald?!", "الباب يا بيتينا. – هل ستفتحين أم لا؟!"],
    [66.9, "Jetzt sitzen wir hier wieder. Scheint eine Silvestertradition zu werden. Apropos Tradition.", "ها نحن عالقون هنا مجدداً. يبدو أنها ستصبح عادة رأس السنة. وبالحديث عن العادات…"],
    [74.0, "„Hinterher ist man immer schlauer.“", "«بعد فوات الأوان يصبح الإنسان دائماً أذكى.»"],
    [76.2, "Was ist mit deiner Tochter? Kann die nicht kommen?", "وماذا عن ابنتك؟ ألا تستطيع أن تأتي؟"],
    [78.7, "Was soll die machen?", "وماذا ستفعل؟"],
    [80.6, "Bereit? – Nein.", "جاهزة؟ – لا."],
    [81.8, "Drei, zwei, eins.", "ثلاثة، اثنان، واحد."],
    [92.5, "Der ruckelt manchmal und bleibt dann stecken.", "هو يهتز أحياناً ثم يعلق."],
    [96.8, "Ist das dein Ernst? Nach allem, was wir durchgemacht haben?", "هل أنت جاد؟ بعد كل ما مررنا به؟"],
    [100.5, "Noch fährt er ja.", "ما زال يتحرك على الأقل."],
    [104.9, "Brauchst du eine Haarnadel? Es meldet sich nie einer.", "هل تحتاجين دبوس شعر؟ لا أحد يرد أبداً."],
    [109.3, "Ja? Hallo?", "نعم؟ ألو؟"],
    [111.0, "Hallo, wir stecken hier fest im Aufzug. Wir fahren wieder. Wir fahren wieder.", "ألو، نحن عالقون في المصعد. عاد يتحرك. عاد يتحرك."],
    [118.4, "Das ist die Dachterrasse? – Ja, genau.", "هذه هي شرفة السطح؟ – نعم، بالضبط."],
    [122.7, "Ist dann eher ein Dach. – Im Sommer ist es hier ganz schön.", "إذاً هي سطح بالأحرى. – في الصيف المكان جميل جداً."],
    [125.8, "Aber runter nehmen wir die Treppe.", "لكن للنزول سنأخذ الدرج."]
  ]
},
{
  id: "s-kranitz", yt: "fy2pPJu668M", start: 1.5, end: 111, src: ["ARD", "Kranitz"], title: "Der Schläger mit Liebeskummer",
  keys: [["etwas versauen", "يُفسد شيئاً (عامية)"], ["Kinderspiel!", "لعبة أطفال / سهل جداً"], ["der Liebeskummer", "حسرة الحب"], ["Moin!", "مرحباً (شمال ألمانيا)"]],
  lines: [
    [2.0, "Sag mal, das kann jetzt wohl nicht wahr sein, Mann. Wie oft habe ich dir das schon gesagt? Du steigst jetzt wieder ein, du fährst mit der Kiste zurück.", "قل لي، هذا لا يُصدَّق يا رجل. كم مرة قلت لك؟ اركب الآن من جديد وارجع بهذه السيارة."],
    [8.0, "Hast du neue Schuhe?", "هل عندك حذاء جديد؟"],
    [9.4, "Moin. – Moin. – Du musst mir helfen!", "مرحباً. – مرحباً. – يجب أن تساعدني!"],
    [13.0, "Ich hab zwei Jobs schon versaut.", "أفسدتُ مهمّتين حتى الآن."],
    [15.9, "Du kennst doch das Blue Bangkok. – Blue Bangkok? – Bramfelder Chaussee, Holtkamp, die Ecke. – Jaja! – War ja Rudis Laden immer gewesen.", "تعرف «بلو بانكوك»، صح؟ – بلو بانكوك؟ – شارع برامفلدر، عند زاوية هولتكامب. – نعم نعم! – كان دائماً محل رودي."],
    [23.8, "Ja, genau. So, dann sollte ich rein gehen und dem Koch die Finger brechen. Hab ich schon ein paar Mal gemacht. – Ist ja ein Standard, klar.", "بالضبط. فكان عليّ أن أدخل وأكسر أصابع الطباخ. فعلتها عدة مرات من قبل. – عمل روتيني، طبعاً."],
    [29.3, "Ja, dann komm ich da rein: Sitzt die ganze Familie da am Tisch, und die haben gefragt, ob ich schon gegessen hätte.", "فدخلت: العائلة كلها جالسة على الطاولة، وسألوني إن كنت قد أكلت."],
    [34.0, "Ja, und dann bist du mit ihm raus, seinen Finger gebrochen. – Ne, ich hatte noch nicht gegessen.", "ثم أخرجته وكسرت إصبعه. – لا، لم أكن قد أكلت بعد."],
    [37.0, "Ja. Und dann hast du ihm die Finger gebrochen. – Nein. Hab ich nicht gemacht. – Wieso denn nicht?", "طيب، ثم كسرت أصابعه. – لا. لم أفعل. – ولماذا لا؟"],
    [40.5, "Weil die gesagt haben, wenn ich ihm die Finger breche, kann der nicht mehr kochen, und dann verdienen sie noch weniger Geld.", "لأنهم قالوا إنني إذا كسرت أصابعه فلن يستطيع الطبخ، وعندها سيكسبون مالاً أقل."],
    [44.6, "Ist doch nicht dein Problem, ob er … – Ich weiß nicht, was los ist!", "هذه ليست مشكلتك إن كان… – لا أعرف ما الذي يحدث لي!"],
    [47.3, "Und dann letzten Donnerstag, ne. Hatte ich die zwei in Nienstedten, im Bungalow. Das war total easy. Ich sollte nur reingehen, ins Kinderzimmer,", "ثم الخميس الماضي، صح. كان عندي هذان الاثنان في نينشتيدن، في البنغالو. كان الأمر سهلاً جداً. كان عليّ فقط أن أدخل غرفة الأطفال،"],
    [54.9, "da ist ein Meerschweinchen im Käfig. Ich sollte das Meerschweinchen wegmachen und einen Zettel hinlegen:", "هناك خنزير غينيا في قفص. كان عليّ أن أتخلص منه وأترك ورقة:"],
    [60.0, "„Heute das Meerschweinchen und morgen seid ihr dran!“ – Ja, schön, ist ein Klassiker. – Schlüssel lag draußen unter der Matte, ich musste nicht mal einbrechen.", "«اليوم خنزير الغينيا وغداً دوركم!» – جميل، كلاسيكية. – المفتاح كان تحت الدواسة في الخارج، لم أضطر حتى للاقتحام."],
    [66.8, "Mein Gott! – Kinderspiel! – Ja, klar. – Aber ich konnte das nicht! Ich hatte das Meerschweinchen schon in der Hand.", "يا إلهي! – لعبة أطفال! – طبعاً. – لكنني لم أستطع! كان خنزير الغينيا في يدي."],
    [71.9, "Und dann hab ich am Ende einfach nur frisches Wasser in die Schale reingemacht, und dann bin ich raus.", "وفي النهاية وضعت فقط ماءً نظيفاً في الصحن وخرجت."],
    [76.7, "Auf dem Zettel hatte ich das „heute“ durchgestrichen und hab geschrieben: „Bald das Meerschweinchen und dann ihr!“", "وعلى الورقة شطبت كلمة «اليوم» وكتبت: «قريباً خنزير الغينيا ثم أنتم!»"],
    [83.0, "Schwierig … – Klaus, was ist denn los mit mir? Was hab ich denn? Ich hab doch was!", "صعب… – كلاوس، ما الذي يحدث لي؟ ما بي؟ أكيد بي شيء!"],
    [86.5, "Weißt du noch meine letzte Diagnose? – Ja. – Verliebt. – Ja. – So. Weißt du, was meine jetzige Diagnose ist? – Ne. – Liebeskummer.", "أتذكر تشخيصي الأخير؟ – نعم. – واقع في الحب. – نعم. – طيب. أتعرف ما تشخيصي الآن؟ – لا. – حسرة الحب."],
    [96.5, "Ach Scheiße … – Ja.", "يا للأسف… – نعم."],
    [98.8, "Du musst doch nicht gleich wieder ins Körperliche gehen bei den alten Männern. – Aber das wäre doch die Gelegenheit.", "لا داعي أن تلجأ للعنف فوراً مع العجائز. – لكنها ستكون فرصة."],
    [104.5, "Bringst du mir noch einmal mit, bitte? Salami und Zwiebeln. Over! – Ich brauch mal die Nummer von deinem Chef. – Ne!", "هل تحضر لي واحدة أخرى من فضلك؟ سلامي وبصل. حوّل! – أحتاج رقم مديرك. – لا!"]
  ]
},
{
  id: "s-soerensen-neu", yt: "AEiJkwMeco4", start: 11, end: 207.5, src: ["ARD", "Sörensen hat Angst"], title: "Neu im Dorf", lesson: "b2-21", keys: keysOf("b2-21").concat(keysOf("b2-22")),
  lines: [
    [11.8, "Ich bin übrigens Ole.", "بالمناسبة، أنا أوله."],
    [14.8, "Sörensen … aber ich hab jetzt kein Bock, die ganze Zeit zu quatschen.", "سورنسن… لكن ليس لدي مزاج أن أثرثر طوال الوقت."],
    [23.7, "War ein gutes Gespräch, Sörensen. – Ja, fand ich auch.", "كانت محادثة جيدة يا سورنسن. – نعم، وأنا أيضاً."],
    [26.8, "Und Sie ganz alleine hier? Ohne Frau? Ich bin ja getrennt. – Weiß ich jetzt gar nicht …", "وأنت وحدك هنا؟ بدون زوجة؟ أنا منفصل. – لا أعرف بالضبط…"],
    [33.3, "Oder Mann? Ohne Mann hier? – Ne, ohne Frau bin ich hier.", "أو زوج؟ بدون زوج هنا؟ – لا، أنا هنا بدون زوجة."],
    [37.3, "Kann ja jeder halten, wie er will. Kann ja jeder ohne Mann oder ohne Frau irgendwo alleine sein heutzutage. – Ich muss jetzt wirklich mal los.", "كل واحد حرّ كما يريد. في هذه الأيام يستطيع أي أحد أن يكون وحده بدون زوج أو زوجة. – يجب أن أذهب الآن فعلاً."],
    [44.1, "Dann mal guten Einzug. – Jo, danke.", "إذاً انتقالاً موفقاً. – نعم، شكراً."]
  ].concat(from("b2-21"), [
    [98.6, "Das ja 'n Ding.", "يا لها من قصة."],
    [99.6, "Was denn?", "ماذا هناك؟"],
    [101.0, "Kuchen ist nicht.", "لا كعكة اليوم."],
    [102.8, "Der Henry ist jetzt tot in seinem Stall.", "هنري (الأرنب) مات الآن في حظيرته."],
    [106.9, "Na, wie geht's? Ich mein … geht's irgendwie? Ah, ist auch 'ne scheiß Frage, ne.", "كيف حالك؟ أقصد… هل الأمور ماشية؟ آه، سؤال سيئ، صح."],
    [117.8, "Ach, ist manchmal aber auch schwer, das Richtige zu sagen, oder?", "لكن أحياناً من الصعب أن تقول الشيء الصحيح، صح؟"],
    [122.2, "Sie wissen selber, dass Sie gerade Quatsch reden, Herr Sörensen.", "أنت تعرف بنفسك أنك تقول كلاماً فارغاً الآن يا سيد سورنسن."],
    [124.2, "Ja, natürlich red ich Quatsch, das mach ich meistens, wenn ich wütend bin.", "طبعاً أقول كلاماً فارغاً، هذا ما أفعله غالباً عندما أكون غاضباً."],
    [126.6, "Ich merk das dann auch selber, aber immer erst am nächsten Tag. In dem Moment, wo ich das sage, kann ich das nicht stoppen, verstehen Sie das?", "ألاحظ ذلك بنفسي، لكن دائماً في اليوم التالي. في اللحظة التي أقوله فيها لا أستطيع أن أوقفه، أتفهم ذلك؟"],
    [132.6, "Jaa. Ich verstehe das.", "نعم. أفهم ذلك."]
  ], from("b2-22"))
},
{
  id: "s-soerensen-floskeln", yt: "JaXf1ahcRa0", start: 0, end: 158, src: ["ARD", "Sörensen fängt Feuer"], title: "Floskeln, Tofu und ein leises Meer", lesson: "b2-24", keys: keysOf("b2-24"),
  lines: from("b2-24").concat([
    [58.6, "Sörensen, wieder Bratkartoffeln?", "سورنسن، بطاطا مقلية مجدداً؟"],
    [62.7, "Ja, du hast ja sonst nichts. – Ich hab Tofu gekauft für dich. – Hör auf. Für mich?", "نعم، فليس عندك غيرها. – اشتريت لك توفو. – لا تمزح. لي أنا؟"],
    [67.5, "Für dich. Weil dich hier keiner leiden kann. Ich kann dich leiden, deshalb habe ich Tofu gekauft. Kann ich was draus machen, zum Beispiel Tofu. – Mensch.", "لك أنت. لأن لا أحد هنا يحبك. أنا أحبك، لذلك اشتريت التوفو. أستطيع أن أصنع منه شيئاً، مثلاً… توفو. – يا رجل."],
    [80.0, "Du bist doch der Teufel. Du säst Zweifel. – Ich säe gar nichts. Und keine Hörner habe ich, keinen großen Mund und keine langen Finger. Ich habe eher kurze. – Ziemlich kurze. – Jetzt mal nicht übertreiben, ne. – Winzig und wurstig.", "أنت الشيطان بعينه. تزرع الشك. – لا أزرع شيئاً. وليس عندي قرون، ولا فم كبير، ولا أصابع طويلة. أصابعي قصيرة بالأحرى. – قصيرة جداً. – لا تبالغ الآن. – صغيرة ومنتفخة كالنقانق."],
    [100.5, "Was ist das hier? – Deich ist das. Der schützt uns vor dem Meer.", "ما هذا؟ – هذا سدّ. يحمينا من البحر."],
    [108.0, "Was heißt jetzt „das Meer“? – Ja, klar. – Ich hör gar nichts. – Ist ein sehr leises Meer.", "ماذا تقصد بـ«البحر»؟ – طبعاً. – لا أسمع شيئاً. – إنه بحر هادئ جداً."],
    [118.5, "Im Ernst, Sörensen, Soja ist nicht gesund. Dein Körper verändert sich.", "بجدّ يا سورنسن، الصويا ليست صحية. جسمك يتغير."],
    [124.5, "Also ich habe noch nie jemanden gesehen, wo ich gedacht hätte: „Ach du Scheiße, zu viel Soja.“ Bei Bier zum Beispiel ist das was anderes, aber da regt sich ja auch keiner auf.", "أنا لم أرَ أبداً أحداً وقلت: «يا للهول، صويا أكثر من اللازم». مع البيرة مثلاً الأمر مختلف، لكن لا أحد ينزعج من ذلك."],
    [133.0, "Ich verstehe einfach nicht, dass die Leute nicht miteinander reden. Man hätte sich doch alles sparen können, aber alle haben einfach Angst, miteinander zu reden. Also gibt's Missverständnisse und Lügen und noch mehr Angst, und am Ende steht man alleine da.", "لا أفهم ببساطة لماذا لا يتكلم الناس مع بعضهم. كان يمكن تجنّب كل شيء، لكن الجميع يخاف أن يتكلم مع الآخر. فتحدث سوء تفاهمات وأكاذيب ومزيد من الخوف، وفي النهاية يبقى الإنسان وحيداً."],
    [145.0, "Nee! – Nee? – Ich finde, die Menschen sollten einfach viel weniger miteinander reden, dann passiert auch nichts. Kein Kontakt, kein Streit, kein Tod, alle glücklich.", "لا! – لا؟ – أنا أرى أن على الناس أن يتكلموا مع بعضهم أقل بكثير، وعندها لا يحدث شيء. لا تواصل، لا خلاف، لا موت، والجميع سعداء."]
  ])
},
{
  id: "s-soerensen-angst", yt: "71LsxVgLzjg", start: 4, end: 174, src: ["ARD", "Sörensen hat Angst"], title: "Angst und Bratkartoffeln", lesson: "b2-23", keys: keysOf("b2-23").concat(keysOf("b2-30")),
  lines: from("b2-30").concat(from("b2-23"), [
    [137.3, "Wenn du ganz viel Glück hast, dann kommt irgendwann mal einer und sagt:", "إذا كنت محظوظاً جداً، يأتي أحدهم في وقت ما ويقول:"],

function speak(text, { rate = S.profile.rate, g = "f", onWord } = {}) {
  return new Promise(res => {
    if (!synth) { toast(t("no_tts"), 4000); return res(false); }
    if (!deVoices.length && !voiceWarned) { voiceWarned = true; toast(t("no_voice"), 6000); }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    const v = voiceFor(g); if (v) u.voice = v;
    const distinct = voiceFor("f") !== voiceFor("m");
    u.pitch = distinct ? 1 : (g === "f" ? 1.12 : 0.82);
    u.rate = Math.max(0.4, Math.min(1.6, rate)) * 0.95;
    u.onboundary = e => { if (onWord && (e.name === "word" || !e.name)) onWord(e.charIndex); };
    u.onend = () => { speaking = false; res(true); };
    u.onerror = () => { speaking = false; res(false); };
    keepUtter.push(u); if (keepUtter.length > 30) keepUtter.shift();
    speaking = true; lastInput = Date.now();
    synth.speak(u);
  });
}

/* ----- clips added by the learner (YouTube link + transcript) ----- */
function ytId(url) {
  const s = String(url || "").trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
const TS_RE = /^(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,]\d+)?\s*(.*)$/;
const NOISE_RE = /^(\d+\s*(seconds?|minutes?|hours?|sekunden?|minuten?|stunden?)[, ]*)+$|^\d+\s*(Sekunde|Minute)/i;
function parseTranscript(txt) {
  const out = []; let pendingT = null;
  for (const raw of String(txt || "").split(/\r?\n/)) {
    const ln = raw.trim();
    if (!ln || NOISE_RE.test(ln)) continue;
    const m = ln.match(TS_RE);
    if (m) {
      const tt = (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]);
      if (m[4]) out.push({ t: tt, raw: m[4] }); else pendingT = tt;
    } else if (pendingT !== null) { out.push({ t: pendingT, raw: ln }); pendingT = null; }
    else if (out.length) out[out.length - 1].raw += " " + ln;
  }
  return out.map(x => { const [de, ar] = x.raw.split("|").map(p => p.trim()); return { t: x.t, de: de || "", ar: ar || "" }; })
    .filter(x => x.de && !/^[\[(].*[\])]$/.test(x.de)).sort((a, b) => a.t - b.t).slice(0, 80);
}
function autoQuestions(lines) {
  const Q = [];
  const words = s => s.split(/\s+/).filter(Boolean);
  const clean = w => w.replace(/^[„“"'(]+|[.,!?;:…“"')]+$/g, "");
  const ordered = lines.filter(x => { const n = words(x.de).length; return n >= 4 && n <= 12; });
  shuffle(ordered).slice(0, 3).forEach(x => Q.push({ k: "order", s: x.de.replace(/\s+/g, " ").trim(), w: ["هذه الجملة كما وردت في المقطع.", "So steht der Satz im Clip."] }));
  const pool = [...new Set(lines.flatMap(x => words(x.de).map(clean)).filter(w => w.length >= 5 && /^[A-Za-zÄÖÜäöüß-]+$/.test(w)))];
  shuffle(lines.filter(x => words(x.de).length >= 5)).slice(0, 3).forEach(x => {
    const cand = words(x.de).map(clean).filter(w => w.length >= 5 && /^[A-Za-zÄÖÜäöüß-]+$/.test(w));
    if (!cand.length) return;
    const target = cand.sort((a, b) => b.length - a.length)[0];
    const others = shuffle(pool.filter(w => w.toLowerCase() !== target.toLowerCase())).slice(0, 2);
    if (others.length < 2) return;
    Q.push({ k: "gap", q: x.de.replace(target, "___"), o: [target, ...others], a: 0, w: ["الكلمة الصحيحة هي «" + target + "» كما في المقطع.", "Im Clip heißt es «" + target + "»."] });
  });
  return Q;
}

function ttsEngine(l, { player, show, setPlaying, listened }) {
  const sayLine = async (i, my) => {

    stopSpeech(); const my = speechRun; setPlaying(true);
    for (let j = i; j < l.L.length; j++) {
      await sayLine(j, my);
      if (my !== speechRun) return;
      await wait(S.profile.rate < 1 ? 650 : 380);
      if (my !== speechRun) return;
    }
    setPlaying(false); listened();
  };
  return {
    play, pause: () => { if (speaking || LS.playing) { speechRun++; if (synth) synth.cancel(); speaking = false; } setPlaying(false); },
    repeat: i => { stopSpeech(); const my = speechRun; sayLine(i, my); },
    cue: () => {}, setRate: () => { if (LS.playing) play(LS.cur); }, destroy: () => {}
  };
}

/* YouTube IFrame player. Only the official embed is used: the clip stays on YouTube's servers. */
let ytApi = null;
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (ytApi) return ytApi;
  ytApi = new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error("timeout")), 9000);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { clearTimeout(to); if (prev) prev(); res(window.YT); };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => { clearTimeout(to); rej(new Error("blocked")); };
    document.head.appendChild(s);
  });
  ytApi.catch(() => { ytApi = null; });
  return ytApi;
}
function videoEngine(l, v, { player, show, setPlaying, listened, rate }) {
  let yp = null, ready = false, timer = null, stopAt = null, dead = false, pendingPlay = null;
  const msg = $("#vmsg", player);
  const lineEnd = i => v.t[i + 1] ?? v.end ?? null;
  const fail = code => {
    const p = LP(l.id); p.videoError = code; p.videoErrorAt = Date.now(); save("progress");
    const unavailable = [100, 101, 150].includes(code);
    msg.hidden = false;
    msg.innerHTML = `<b>${esc(t(unavailable ? "video_gone" : "video_blocked"))}</b><span>${esc(t("video_gone_sub"))}</span>
      <a class="btn sm" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.yt)}&t=${Math.floor(v.start || 0)}s" target="_blank" rel="noopener">YouTube</a>
      ${l.custom ? "" : `<button class="btn sm" id="vFallback">${esc(t("video_use_audio"))}</button>`}`;
    const fb = $("#vFallback", msg);
    if (fb) fb.onclick = () => { l._videoFailed = true; renderLessonTab(l); };
    setPlaying(false);
  };
  const tick = () => {
    if (!ready || dead) return;
    let tt = 0; try { tt = yp.getCurrentTime(); } catch (e) { return; }
    let i = 0; v.t.forEach((x, j) => { if (x <= tt + 0.08) i = j; });
    if (i !== LS.cur) show(i, LS.playing);
    if (stopAt !== null && tt >= stopAt - 0.05) { yp.pauseVideo(); stopAt = null; }
    if (v.end && tt >= v.end - 0.05) { yp.pauseVideo(); listened(); }
  };
  const seekPlay = (i, only) => {
    if (!ready) { pendingPlay = [i, only]; return; }
    stopSpeech();
    stopAt = only ? lineEnd(i) : (v.end ?? null);
    yp.seekTo(Math.max(0, v.t[i] - 0.15), true); yp.playVideo(); show(i, true);
  };
  loadYT().then(YT => {
    if (dead || !player.isConnected) return;
    yp = new YT.Player($("#yt", player), {
      videoId: v.yt, width: "100%", height: "100%",
      playerVars: { start: Math.floor(v.start ?? v.t[0] ?? 0), end: v.end ? Math.ceil(v.end) : undefined, rel: 0, playsinline: 1, modestbranding: 1, cc_load_policy: 0, iv_load_policy: 3, hl: ui() },
      events: {
        onReady: () => { ready = true; msg.hidden = true; try { yp.setPlaybackRate(rate); } catch (e) {} if (pendingPlay) { const [i, o] = pendingPlay; pendingPlay = null; seekPlay(i, o); } },
        onStateChange: e => { if (e.data === 1) { setPlaying(true); lastInput = Date.now(); } else if (e.data === 2 || e.data === 0) { setPlaying(false); if (e.data === 0) listened(); } },
        onError: e => fail(e.data)
      }
    });
    timer = setInterval(tick, 200);
  }).catch(() => { if (!dead) fail("blocked"); });
  return {
    play: i => seekPlay(i, false),
    pause: () => { stopAt = null; if (ready) yp.pauseVideo(); setPlaying(false); },
    repeat: i => seekPlay(i, true),
    cue: i => { if (ready) yp.seekTo(Math.max(0, v.t[i] - 0.15), true); },
    setRate: r => { if (ready) try { yp.setPlaybackRate(r); } catch (e) {} },
    destroy: () => { dead = true; clearInterval(timer); try { yp && yp.destroy(); } catch (e) {} }
  };
}
function fmtClock(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function saveBtn(de, label) { const s = isSaved(de); return `<button class="btn sm ${s ? "done" : ""}" data-save="${esc(de)}" ${s ? "disabled" : ""}>${IC.bookmark}<span>${esc(s ? t("saved") : label || t("save"))}</span></button>`; }

/* ----- exercises ----- */
const ES = {};
function renderExercises(l, box) {
  const st = ES[l.id];
  const p = S.progress.lessons[l.id] || {};
  if (!l.Q.length) { box.innerHTML = `<p class="muted">${esc(t("no_ex"))}</p>`; return; }
  if (!st) {
    box.innerHTML = `<section class="card center"><h2 class="h2">${esc(t("ex_title"))}</h2>
      <p class="muted">${l.Q.map(q => esc(t("k_" + q.k))).join(" · ")}</p>
      ${p.done ? `<p>${esc(t("best"))}: <b>${p.best}%</b></p>` : ""}
      <button class="btn primary" id="exGo">${esc(p.done ? t("ex_again") : t("ex_start"))}</button></section>`;
    $("#exGo").onclick = () => { ES[l.id] = { i: 0, first: [], tries: 0 }; renderExercises(l, box); };
    return;
  }
  if (st.i >= l.Q.length) return renderResult(l, box);
  const q = l.Q[st.i];
  const qid = l.id + ":" + st.i;
  box.innerHTML = `<section class="excard">
    <div class="row-between"><span class="eyebrow">${esc(t("q_of", st.i + 1, l.Q.length))} · ${esc(t("k_" + q.k))}</span></div>
    <div class="track"><i style="width:${st.i / l.Q.length * 100}%"></i></div>
    <div id="qbody"></div><div id="fb" class="fb" hidden></div>
    <div class="row-end" id="qnav"></div></section>`;
  const qb = $("#qbody", box), fb = $("#fb", box), nav = $("#qnav", box);
  const record = ok => {
    if (st.tries === 0) {
      st.first[st.i] = ok;
      const d = today(); d.ex++; if (ok) d.ok++;
      const kk = S.activity.kinds[q.k] || (S.activity.kinds[q.k] = { n: 0, wrong: 0 });
      kk.n++; if (!ok) { kk.wrong++; S.activity.wrong[qid] = (S.activity.wrong[qid] || 0) + 1; }
      flushTime(); save("activity");
    }
    st.tries++;
  };
  const feedback = (ok, retry) => {
    fb.hidden = false; fb.className = "fb " + (ok ? "good" : "bad");
    fb.innerHTML = `<b>${esc(ok ? t("correct") : t("wrong"))}</b><p lang="${S.profile.explLang}">${esc(ex(q.w))}</p>
      <button class="linkbtn" id="fbOther">${esc(t(S.profile.explLang === "de" ? "show_other_ar" : "show_other_de"))}</button><p class="other" hidden lang="${S.profile.explLang === "de" ? "ar" : "de"}">${esc(exOther(q.w))}</p>`;
    $("#fbOther", fb).onclick = e => { e.target.hidden = true; $(".other", fb).hidden = false; };
    nav.innerHTML = (ok ? "" : `<button class="btn ghost" id="qRetry">${esc(t("try_again"))}</button>`) +
      `<button class="btn primary" id="qNext">${esc(st.i === l.Q.length - 1 ? t("finish") : t("next_q"))}</button>`;
    if (!ok) $("#qRetry", nav).onclick = retry;
    $("#qNext", nav).onclick = () => { st.i++; st.tries = 0; renderExercises(l, box); };
  };
  if (q.o) {
    const opts = shuffle(q.o.map((o, i) => ({ o, i })));
    qb.innerHTML = `${q.k === "listen" ? `<button class="btn sm" id="qListen">${IC.speak}<span>${esc(t("replay_dialog"))}</span></button>` : ""}
      <p class="qtext" lang="de" dir="ltr">${esc(q.q).replace("___", '<span class="gap">_____</span>')}</p>
      <div class="opts">${opts.map(x => `<button class="opt" data-i="${x.i}" lang="de" dir="ltr">${esc(x.o)}</button>`).join("")}</div>`;
    if (q.k === "listen") $("#qListen", qb).onclick = async () => { stopSpeech(); const my = speechRun; for (const x of l.L) { await speak(x[1], { g: l.sp[x[0]][1] }); if (my !== speechRun) return; await wait(300); } };
    const reset = () => { fb.hidden = true; nav.innerHTML = ""; $$(".opt", qb).forEach(b => { b.disabled = false; b.className = "opt"; }); };
    $$(".opt", qb).forEach(b => b.onclick = () => {
      stopSpeech();
      const ok = +b.dataset.i === q.a; record(ok);
      $$(".opt", qb).forEach(x => { x.disabled = true; if (+x.dataset.i === q.a && ok) x.classList.add("right"); });
      b.classList.add(ok ? "right" : "wrongpick");
      if (ok && q.k === "gap") { const g = $(".gap", qb); if (g) g.textContent = q.o[q.a]; }
      feedback(ok, reset);
    });
  } else if (q.p) {
    const left = shuffle(q.p.map((x, i) => ({ s: x[0], i }))), right = shuffle(q.p.map((x, i) => ({ s: x[1], i })));
    const rightIsDe = !/[؀-ۿ]/.test(q.p[0][1]);
    qb.innerHTML = `<p class="muted">${esc(t("match_hint"))}</p><div class="match">
      <div class="col">${left.map(x => `<button class="mt" data-side="l" data-i="${x.i}" lang="de" dir="ltr">${esc(x.s)}</button>`).join("")}</div>
      <div class="col">${right.map(x => `<button class="mt" data-side="r" data-i="${x.i}" ${rightIsDe ? 'lang="de" dir="ltr"' : 'lang="ar" dir="rtl"'}>${esc(x.s)}</button>`).join("")}</div></div>`;
    let sel = null, matched = 0, anyWrong = false;
    $$(".mt", qb).forEach(b => b.onclick = () => {
      if (b.classList.contains("locked")) return;
      if (b.dataset.side === "l") { $$('.mt[data-side="l"]', qb).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; return; }
      if (!sel) { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); return; }
      if (sel.dataset.i === b.dataset.i) { sel.classList.remove("sel"); sel.classList.add("locked"); b.classList.add("locked"); sel.disabled = b.disabled = true; sel = null; matched++; }
      else { anyWrong = true; b.classList.add("shake", "wrongpick"); setTimeout(() => b.classList.remove("shake", "wrongpick"), 600); }
      if (matched === q.p.length) { record(!anyWrong); feedback(true, null); if (anyWrong) { fb.className = "fb mixed"; } }
    });
  } else if (q.s) {
    const words = q.s.split(" ");
    let pool = shuffle(words.map((w, i) => ({ w, i })));
    for (let n = 0; n < 5 && pool.map(x => x.w).join(" ") === q.s; n++) pool = shuffle(pool);
    const picked = [];
    const draw = () => {
      qb.innerHTML = `<p class="muted">${esc(t("order_hint"))}</p>
        <div class="answer" lang="de" dir="ltr">${picked.map((x, j) => `<button class="tok on" data-j="${j}">${esc(x.w)}</button>`).join("") || '<span class="muted">…</span>'}</div>
        <div class="pool" lang="de" dir="ltr">${pool.map((x, j) => `<button class="tok" data-p="${j}" ${x.used ? "disabled" : ""}>${esc(x.w)}</button>`).join("")}</div>
        <div class="row-end"><button class="btn ghost sm" id="oReset">${esc(t("reset"))}</button><button class="btn primary sm" id="oCheck" ${picked.length === words.length ? "" : "disabled"}>${esc(t("check"))}</button></div>`;
      $$("[data-p]", qb).forEach(b => b.onclick = () => { const x = pool[+b.dataset.p]; x.used = true; picked.push(x); draw(); });
      $$("[data-j]", qb).forEach(b => b.onclick = () => { const x = picked.splice(+b.dataset.j, 1)[0]; x.used = false; draw(); });
      $("#oReset", qb).onclick = () => { picked.length = 0; pool.forEach(x => { x.used = false; }); fb.hidden = true; nav.innerHTML = ""; draw(); };
      $("#oCheck", qb).onclick = () => {
        const ok = picked.map(x => x.w).join(" ") === q.s; record(ok);
        $$(".tok", qb).forEach(b => { b.disabled = true; });
        $(".answer", qb).classList.add(ok ? "right" : "wrongpick");
        if (!ok) $(".answer", qb).insertAdjacentHTML("afterend", `<p class="solution" lang="de" dir="ltr">✓ ${esc(q.s)}</p>`);
        feedback(ok, () => { picked.length = 0; pool.forEach(x => { x.used = false; }); fb.hidden = true; nav.innerHTML = ""; draw(); });
        if (ok) sayInto(q.s, null);
      };
    };
    draw();
  }
}
function renderResult(l, box) {
  const st = ES[l.id];
  const right = st.first.filter(Boolean).length, total = l.Q.length, pct = Math.round(right / total * 100);
  if (!st.saved) {
    st.saved = true;
    const p = LP(l.id), firstTime = !p.done;
    p.done = true; p.attempts = (p.attempts || 0) + 1; p.last = pct; p.best = Math.max(p.best || 0, pct); p.doneAt = p.doneAt || Date.now();
    if (firstTime) today().lessons++;
    flushTime(); save("progress", "activity");
  }
  const idx = LESSONS.indexOf(l);
  box.innerHTML = `<section class="card center result">
    <span class="eyebrow">${esc(t("result"))}</span>

    <div class="row wrap center-row">

}

  <section class="card block"><div class="row-between"><h2 class="h2">${esc(t("last30"))}</h2><span class="muted">${fmtMin(month.reduce((a, x) => a + x.v.sec, 0))}</span></div>${barChart(month, { height: 130 })}</section>
  <section class="card block"><h2 class="h2">${esc(t("nav_vocab"))}</h2>
    ${items.length ? `<div class="stack" dir="ltr">${["new", "learning", "mastered"].map(k => vc[k] ? `<i class="s-${k}" style="flex:${vc[k]}" title="${esc(t("st_" + k))}"></i>` : "").join("")}</div>
    <div class="legend">${["new", "learning", "mastered"].map(k => `<span><i class="s-${k}"></i>${esc(t("st_" + k))} ${vc[k]}</span>`).join("")}</div>` : `<p class="muted">${esc(t("no_data"))}</p>`}</section>
  <section class="card block"><h2 class="h2">${esc(t("mistakes"))}</h2>
    ${kinds.length ? `<ul class="kbars">${kinds.map(k => `<li><span>${esc(t("k_" + k.k))}</span><span class="kb"><i style="width:${Math.round(k.rate * 100)}%"></i></span><small class="muted">${esc(t("wrong_n", k.wrong, k.n))}</small></li>`).join("")}</ul>` : `<p class="muted">${esc(t("mistakes_empty"))}</p>`}
    ${topWrong.length ? `<ul class="wlist">${topWrong.map(x => `<li><a href="#lesson-${x.l.id}"><span class="muted">${x.l.n} · ${esc(t("k_" + x.q.k))} · ${x.n}×</span><span lang="de" dir="ltr">${esc(x.q.q || x.q.s || x.q.p.map(p => p[0]).join(", "))}</span></a></li>`).join("")}</ul>` : ""}
  </section>`;
}

/* ----- profile / settings ----- */
let resetArmed = false;
async function viewProfile(v) {
  const P = S.profile;
  const sel = (id, val, opts) => `<select id="${id}">${opts.map(([k, lab]) => `<option value="${k}" ${String(val) === String(k) ? "selected" : ""}>${esc(lab)}</option>`).join("")}</select>`;
  v.innerHTML = `
  <header class="phead"><h1 class="h1">${esc(t("profile_title"))}</h1></header>
  <section class="card block"><h2 class="h2">${esc(t("account"))}</h2>
    <p id="accName" class="accname"></p>
    ${backend.mode === "supa" ? `<p dir="ltr" class="accname">${esc(backend.email || "")}</p><p>${esc(t("acc_supa"))}</p><button class="btn" id="sLogout">${esc(t("au_logout"))}</button>`
      : `<p>${esc(backend.mode === "cloud" ? t("acc_cloud") : t("acc_local"))}</p>${backend.mode === "cloud" ? `<p class="muted small">${esc(t("logout_note"))}</p>` : (supaClient() ? `<button class="btn" id="sLogin">${esc(t("au_login"))}</button>` : "")}`}</section>
  <section class="card block form">
    <label>${esc(t("ui_lang"))}${sel("sUi", P.uiLang, [["ar", "العربية"], ["de", "Deutsch"]])}</label>
    <label>${esc(t("expl_lang"))}${sel("sExpl", P.explLang, [["ar", t("lang_ar")], ["de", t("lang_de")]])}</label>
    <label>${esc(t("goal"))}${sel("sGoal", P.goal, [["daily", t("g_daily")], ["work", t("g_work")], ["exam", t("g_exam")]])}</label>
    <label>${esc(t("theme"))}${sel("sTheme", P.theme, [["system", t("th_system")], ["light", t("th_light")], ["dark", t("th_dark")]])}</label>
    <label>${esc(t("def_speed"))}${sel("sRate", P.rate, [[0.6, "0.6×"], [0.8, "0.8×"], [1, "1×"], [1.2, "1.2×"]])}</label>
  </section>
  <section class="card block"><h2 class="h2">${esc(t("voice"))}</h2>
    <p>${deVoices.length ? esc(deVoices.slice(0, 3).map(x => x.name).join(" · ")) : esc(t("voice_none"))}</p>
    <button class="btn sm" id="sVoice">${IC.speak}<span>${esc(t("test_voice"))}</span></button></section>
  <section class="card block"><h2 class="h2">${esc(t("about"))}</h2><p>${esc(t("about_body"))}</p></section>
  <section class="block"><button class="btn danger" id="sReset">${esc(resetArmed ? t("reset_confirm") : t("reset_all"))}</button></section>`;
  const bind = (id, key, num, after) => { $(id, v).onchange = e => { P[key] = num ? +e.target.value : e.target.value; save("profile"); if (after) after(); }; };
  bind("#sUi", "uiLang", false, () => { applyChrome(); viewProfile(v); });
  bind("#sExpl", "explLang");
  bind("#sGoal", "goal");
  bind("#sTheme", "theme", false, applyChrome);
  bind("#sRate", "rate", true);
  if ($("#sLogout", v)) $("#sLogout", v).onclick = async () => { await flush(); try { await sb.auth.signOut(); } catch (e) {} location.hash = "home"; location.reload(); };
  if ($("#sLogin", v)) $("#sLogin", v).onclick = () => { location.hash = "home"; location.reload(); };
  $("#sVoice", v).onclick = () => sayInto("Da muss ich noch einmal eine Nacht drüber schlafen.", null);
  $("#sReset", v).onclick = () => {
    if (!resetArmed) { resetArmed = true; viewProfile(v); return; }
    resetArmed = false;
    const keep = S.profile; S = defaults(); S.profile = keep;
    reviewQueue = null; Object.keys(ES).forEach(k => delete ES[k]);
    save("progress", "vocab", "activity"); toast(t("reset_done")); viewProfile(v);
  };
  if (backend.mode === "cloud" && backend.user) {
    try { const me = await backend.user.me(); const el = $("#accName", v); if (el && me && me.name) el.textContent = me.name; } catch (e) {}
  }
}

/* ================= sheet ================= */
function openSheet(html) {
  const sh = $("#sheet");
  sh.innerHTML = `<div class="grab"></div><button class="iconbtn sheet-x" id="sheetX" aria-label="close">${IC.close}</button>${html}`;
  sh.dir = ui() === "de" ? "ltr" : "rtl";
  sh.hidden = false; $("#scrim").hidden = false; sh.scrollTop = 0;
  $("#sheetX").onclick = () => closeSheet();
  return sh;
}
function closeSheet(silent) { if (!silent) stopSpeech(); $("#sheet").hidden = true; $("#scrim").hidden = true; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ================= onboarding / gate ================= */
function showGate() {
  return new Promise(res => {
    $("#view").innerHTML = `<section class="gate card"><span class="lvl" lang="de">B2</span><h1 class="h1">${esc(t("gate_title"))}</h1><p>${esc(t("gate_body"))}</p>
      <button class="btn ghost" id="gLocal">${esc(t("gate_local"))}</button></section>`;
    $("#gLocal").onclick = () => { backend.mode = "local"; res(); };
  });
}
function showOnboarding() {
  return new Promise(res => {
    const P = S.profile;
    const draw = () => {
      applyChrome();
      const opt = (name, val, lab) => `<label class="pick"><input type="radio" name="${name}" value="${val}" ${P[name] === val ? "checked" : ""}><span>${esc(lab)}</span></label>`;
      $("#view").innerHTML = `<section class="onb card"><span class="lvl" lang="de">B2 → C1</span><h1 class="h1">${esc(t("onb_title"))}</h1><p class="muted">${esc(t("onb_sub"))}</p>
        <fieldset><legend>${esc(t("ui_lang"))}</legend>${opt("uiLang", "ar", "العربية")}${opt("uiLang", "de", "Deutsch")}</fieldset>
        <fieldset><legend>${esc(t("expl_lang"))}</legend>${opt("explLang", "ar", t("lang_ar"))}${opt("explLang", "de", t("lang_de"))}</fieldset>
        <fieldset><legend>${esc(t("goal"))}</legend>${opt("goal", "daily", t("g_daily"))}${opt("goal", "work", t("g_work"))}${opt("goal", "exam", t("g_exam"))}</fieldset>
        <button class="btn primary big" id="oGo">${esc(t("start"))}</button></section>`;
      $$("input[type=radio]").forEach(r => r.onchange = () => { P[r.name] = r.value; if (r.name === "uiLang") draw(); });
      $("#oGo").onclick = () => { P.onboarded = true; save("profile"); res(); };
    };
    draw();
  });
}

/* ================= boot ================= */
async function boot() {
  applyChrome();
  $("#view").innerHTML = `<div class="splash"><span class="lvl" lang="de">DeutschFlow</span><p class="muted">${esc(t("loading"))}</p></div>`;
  const inClaude = !!(window.claude && typeof window.claude.use === "function");
  const cloud = inClaude && await connectCloud();
  if (!cloud) {
    const session = !inClaude && supaClient() ? await supaSession() : null;
    if (session && !recovering) Object.assign(backend, { mode: "supa", uid: session.user.id, email: session.user.email });
    else if (!inClaude && supaClient()) await showAuth();
    else await showGate();
  }
  try { await loadAll(); }
  catch (e) { toast(t("sync_error"), 5000); }
  rebuildLessons();
  if (backend.mode === "supa" && recovering) { await showAuth(); }
  applyChrome();
  if (!S.profile.onboarded) await showOnboarding();
  applyChrome();
  render();
}
boot();
})();

</script>
